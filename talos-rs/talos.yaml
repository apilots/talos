gateway:
  port: 8080
  host: "0.0.0.0"
  token: "talos-local-test-token"
  jwt_secret: ${JWT_SECRET}
  auth: false

agent:
  name: "talos"
  model: "qwen-max"
  kernel:
    max_iters: 1
    max_task_per_turn: 3
    tool_parallelism: 4
    max_llm_calls: 8
    max_tool_rounds: 8
    tool_result_max_bytes: 65536
    context_compaction_max_bytes: 262144
    default_workspace_id: "default"
    planner_mode: "built_in"
    allow_request_planner_override: false
    prompt:
      max_static_tokens: 1200
      max_dynamic_tokens: 3200
      include_workspace_summary: true
      include_recent_messages: true
    memory:
      workspace_dir: "~/.talos/workspace/memory"
      hot_recent_messages: 64
      context_target_messages: 24
      enable_summary: true
      summary_recent_count: 2
      summary_max_chars: 1200
      compaction_threshold_bytes: 262144
      long_term_fact_extraction_enabled: true
      long_term_min_importance: 0.7
    binding:
      default_agent_kind: "llm"

channels:
  whatsapp:
    enabled: false
  telegram:
    enabled: false
    token: ${TELEGRAM_BOT_TOKEN}
    allow_from: []
    dm_policy: "open"
    group_policy: "mention"
    group_allow_from: []
    dm_scope: "per_channel_peer_topic"
    mode: "polling"
    webhook_url: null
    accounts:
      - id: "telegram-default"
        enabled: false
        token: ${TELEGRAM_ACCOUNT_1_TOKEN}
        dm_policy: "open"
        group_policy: "mention"
        allow_from: []
        group_allow_from: []
        mode: "polling"
        webhook_url: ${TELEGRAM_ACCOUNT_1_WEBHOOK_URL}
        groups:
          - id: ${TELEGRAM_GROUP_ID}
            require_mention: true
            allow_from: []
            topics:
              - id: ${TELEGRAM_TOPIC_ID}
                require_mention: false
                allow_from: []
      - id: "telegram-webhook"
        enabled: false
        token: ${TELEGRAM_ACCOUNT_2_TOKEN}
        dm_policy: "open"
        group_policy: "mention"
        allow_from: []
        group_allow_from: []
        mode: "webhook"
        webhook_url: ${TELEGRAM_ACCOUNT_2_WEBHOOK_URL}
        groups: []
  discord:
    enabled: false
  feishu:
    enabled: false

llm:
  provider: "bailian"
  model: "qwen-max"
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    enabled: false
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: "https://api.openai.com/v1"
    enabled: false
  bailian:
    api_key: ${BAILIAN_API_KEY}
    enabled: true
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    supported_models:
      - "qwen-max"
      - "qwen-plus"
      - "qwen-turbo"
  ollama:
    api_key: null
    enabled: false
    base_url: "http://localhost:11434"

logging:
  level: "info"
  format: "text"
  stdout: true
  file: "logs/talos.log"

storage:
  database_type: "sqlite"
  connection_string: "talos.db"
  max_connections: 5
