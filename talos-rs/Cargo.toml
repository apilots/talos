[workspace]
resolver = "2"
members = [
    # Common
    "crates/common/llm/provider",
    "crates/common/llm/anthropic",
    "crates/common/llm/bailian",
    "crates/common/llm/deepseek",
    "crates/common/llm/openrouter",
    "crates/common/llm/ollama",
    "crates/common/llm/openai",
    "crates/common/fs",
    "crates/common/guard-task",
    "crates/common/knowledge-format",
    "crates/common/prompt",
    "crates/common/types",
    # Infra
    "crates/infra/error",
    "crates/infra/config",
    "crates/infra/logging",
    "crates/infra/storage",
    "crates/infra/auth",
    "crates/infra/automation",
    "crates/infra/system-info",
    # Perception
    "crates/perception/channels",
    # Cognition
    "crates/cognition/memory",
    # Action
    "crates/action/mcp",
    "crates/action/browser",
    "crates/action/plugin",
    "crates/action/skills",
    "crates/action/tools",
    "crates/action/tools-policy",
    "crates/action/tools-sandbox",
    "crates/action/sandbox-spi",
    "crates/action/macos-sandbox",
    "crates/action/linux-sandbox",
    "crates/action/windows-sandbox",
    # Orchestration
    "crates/orchestration/agent-api",
    "crates/orchestration/agent-pb",
    "crates/orchestration/agent-client",
    "crates/orchestration/agent-protocol",
    "crates/orchestration/run-control",
    "crates/orchestration/agent-kernel",
    "crates/orchestration/agent-provider-kernel",
    "crates/orchestration/agent",
    "crates/orchestration/store",
    "crates/orchestration/sync",
    "crates/orchestration/service",
    "crates/orchestration/router",
    "crates/orchestration/coordinator",
    # Gateway
    "crates/gateway/core",
    "crates/gateway/http",
    "crates/gateway/app-protocol",
    "crates/gateway/app-server",
    # App
    "crates/app/talos-upgrade",
    "crates/app/talos-base",
    "crates/app/talos-worker",
    # Apps
    "apps/sdk",
    "apps/sdk-embedded",
    "apps/app-server-test-client",
    "apps/tui",
    # Binary
    "bin/app-server",
    "bin/talos-server",
    "bin/talos-worker",
]

[workspace.package]
version = "0.1.13"
edition = "2021"
authors = ["Liu Xi"]
license = "Apache-2.0"
repository = "https://github.com/xiliu/talos"
description = "Talos - AI Agent Framework"

[workspace.dependencies]
# Async
wgpu = { version = "30.0.1", default-features = false, features = ["std", "metal", "vulkan"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
talos-system-info = { path = "crates/infra/system-info" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tokio-stream = "0.1"
async-trait = "0.1"
bytes = "1"
prost = "0.14"
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
rustls = "0.23"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
libc = "0.2.182"
seccompiler = "0.5.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
ts-rs = "10"
semver = { version = "1", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
config = "0.14"
toml = "0.8"
infer = "0.22"
csv = "1"
calamine = "0.36"

# Storage
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "migrate"] }
opendal = { version = "0.57", default-features = false }
croner = "2.2"
redis = "0.24"

# Networking
futures-util = "0.3"
fs4 = "1"
atomic-write-file = "0.3"
wait-timeout = "0.2"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
getrandom = "0.2"
subtle = "2"
moka = { version = "0.12", features = ["sync"] }
okf-core = "=0.2.4"
okf-validator = "=0.2.4"

# HTTP
reqwest = { version = "0.12", features = ["json"] }
firecrawl = "2.11"
tavily = "2.1"
rmcp = { version = "3.2.0", default-features = false }
talos-cloud-sdk = "=0.1.3"

# Internal crates
talos-error = { path = "crates/infra/error" }
talos-fs = { path = "crates/common/fs" }
talos-guard-task = { path = "crates/common/guard-task" }
talos-browser = { path = "crates/action/browser" }
talos-knowledge-format = { path = "crates/common/knowledge-format" }
talos-types = { path = "crates/common/types" }
talos-mcp = { path = "crates/action/mcp" }
talos-plugin = { path = "crates/action/plugin" }
talos-skills = { path = "crates/action/skills" }
talos-tools = { path = "crates/action/tools" }
talos-tools-policy = { path = "crates/action/tools-policy" }
talos-tools-sandbox = { path = "crates/action/tools-sandbox" }
talos-sandbox-spi = { path = "crates/action/sandbox-spi" }
talos-macos-sandbox = { path = "crates/action/macos-sandbox" }
talos-linux-sandbox = { path = "crates/action/linux-sandbox" }
talos-windows-sandbox = { path = "crates/action/windows-sandbox" }
talos-memory = { path = "crates/cognition/memory" }
talos-auth = { path = "crates/infra/auth" }
talos-automation = { path = "crates/infra/automation" }
talos-gateway = { path = "crates/gateway/core" }
talos-app-protocol = { path = "crates/gateway/app-protocol" }
talos-app-server = { path = "crates/gateway/app-server" }
talos-agent-kernel = { path = "crates/orchestration/agent-kernel" }
talos-agent-provider-kernel = { path = "crates/orchestration/agent-provider-kernel" }
talos-agent-api = { path = "crates/orchestration/agent-api" }
agent-pb = { path = "crates/orchestration/agent-pb" }
agent-client = { path = "crates/orchestration/agent-client" }
agent-protocol = { path = "crates/orchestration/agent-protocol" }
talos-agent = { path = "crates/orchestration/agent" }
talos-run-control = { path = "crates/orchestration/run-control" }
talos-store = { path = "crates/orchestration/store" }
talos-sync = { path = "crates/orchestration/sync" }
talos-sync-types = "=0.1.3"
talos-sync-sdk = "=0.1.3"
talos-service = { path = "crates/orchestration/service" }
talos-llm-provider = { path = "crates/common/llm/provider" }
talos-prompt = { path = "crates/common/prompt" }
talos-llm-anthropic = { path = "crates/common/llm/anthropic" }
talos-llm-bailian = { path = "crates/common/llm/bailian" }
talos-llm-deepseek = { path = "crates/common/llm/deepseek" }
talos-llm-openrouter = { path = "crates/common/llm/openrouter" }
talos-llm-ollama = { path = "crates/common/llm/ollama" }
talos-llm-openai = { path = "crates/common/llm/openai" }
talos-config = { path = "crates/infra/config" }
talos-logging = { path = "crates/infra/logging" }
talos-storage = { path = "crates/infra/storage" }
talos-channel = { path = "crates/perception/channels" }
talos-sdk = { path = "apps/sdk" }
talos-sdk-embedded = { path = "apps/sdk-embedded" }
talos-base = { path = "crates/app/talos-base" }
talos-worker = { path = "crates/app/talos-worker" }
talos-upgrade = { path = "crates/app/talos-upgrade" }

[workspace.lints.rust]
unused_must_use = "deny"

[profile.dev]
# Keep source locations in local backtraces while minimizing debug artifacts.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies rarely need debugger metadata during local development.
debug = false

[profile.test]
# Test binaries are optimized for fast feedback; use the debugging profile when needed.
debug = false

[profile.debugging]
inherits = "dev"
debug = "full"

[profile.debugging.package."*"]
debug = "full"
