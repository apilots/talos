[package]
name = "talos-sdk-embedded"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Talos embedded SDK client for in-process runtime access"

[features]
default = ["sync", "relay-client"]
sync = ["talos-base/sync"]
relay-client = ["talos-base/relay-client"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
talos-auth = { workspace = true }
talos-base = { workspace = true }
talos-error = { workspace = true }
talos-gateway = { workspace = true }
talos-sdk = { workspace = true }
talos-service = { workspace = true, features = ["product"] }
talos-types = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
