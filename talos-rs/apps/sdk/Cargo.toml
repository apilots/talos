[package]
name = "talos-client"
version = "0.1.0"
edition = "2021"
description = "Talos client library for connecting to the gateway"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { workspace = true }
talos-app-protocol = { workspace = true }
talos-config = { workspace = true }
talos-types = { path = "../../crates/common/types" }
talos-auth = { workspace = true }
talos-error = { path = "../../crates/infra/error" }

[dev-dependencies]
