[package]
name = "talos-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Talos SDK library for connecting to App Server and gateway APIs"

[dependencies]
reqwest.workspace = true
futures-util.workspace = true
uuid.workspace = true
talos-logging.workspace = true
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
talos-agent-api = { workspace = true }
talos-app-protocol = { workspace = true }
talos-types = { path = "../../crates/common/types" }
talos-auth = { workspace = true }
talos-error = { path = "../../crates/infra/error" }

[dev-dependencies]
axum = "0.7"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
