[package]
name = "talos-sdk"
version = "0.1.2"
edition = "2021"
description = "Talos SDK library for connecting to App Server and gateway APIs"

[dependencies]
async-trait = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { workspace = true }
talos-app-protocol = { workspace = true }
talos-config = { workspace = true }
talos-types = { path = "../../crates/common/types" }
talos-auth = { workspace = true }
talos-error = { path = "../../crates/infra/error" }

[dev-dependencies]
