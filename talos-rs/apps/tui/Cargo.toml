[package]
name = "talos-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Talos terminal user interface and command mode"
autobins = false

[[bin]]
name = "talos"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { workspace = true, features = ["rt-multi-thread"] }
bytes = { workspace = true }
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
talos-error = { workspace = true }
talos-types = { workspace = true }
talos-tools-policy = { workspace = true }
talos-sdk = { path = "../sdk" }
talos-sdk-embedded = { path = "../sdk-embedded" }
talos-base = { workspace = true }
talos-logging = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
clap = { version = "4.0", features = ["derive"] }
unicode-width = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "process"] }

[lints]
workspace = true
