[package]
name = "talos-tui"
version = "0.1.3"
edition = "2021"
description = "Talos terminal user interface and command mode"
autobins = false

[[bin]]
name = "talos"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1.0", features = ["full"] }
talos-error = { workspace = true }
talos-types = { workspace = true }
talos-tools-policy = { workspace = true }
talos-sdk = { path = "../sdk" }
talos-sdk-embedded = { path = "../sdk-embedded" }
talos-config = { workspace = true }
talos-base = { workspace = true }
talos-logging = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
clap = { version = "4.0", features = ["derive"] }
unicode-width = "0.1"
