[package]
name = "talos-cli"
version = "0.1.2"
edition = "2021"
description = "Talos CLI application"

[[bin]]
name = "talos-cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { workspace = true }
talos-sdk = { path = "../sdk" }
talos-sdk-embedded = { path = "../sdk-embedded" }
talos-config = { workspace = true }
