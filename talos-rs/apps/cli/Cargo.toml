[package]
name = "talos-cli"
version = "0.1.0"
edition = "2021"
description = "Talos CLI application"

[[bin]]
name = "talos-client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing-subscriber = "0.3"
talos-client = { path = "../sdk" }
