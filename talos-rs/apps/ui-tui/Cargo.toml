[package]
name = "talos-ui-tui"
version = "0.1.0"
edition = "2021"
description = "Talos TUI (Terminal User Interface) module"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1.0", features = ["full"] }
talos-error = { workspace = true }
talos-types = { workspace = true }
talos-llm-provider = { workspace = true }
talos-agent = { path = "../../crates/orchestration/agent" }
talos-memory = { path = "../../crates/cognition/memory" }
talos-tools = { path = "../../crates/action/tools" }
talos-tools-policy = { workspace = true }
talos-client = { path = "../sdk" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
clap = { version = "4.0", features = ["derive"] }
unicode-width = "0.1"
