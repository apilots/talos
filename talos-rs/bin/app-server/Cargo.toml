[package]
name = "app-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "app-server"
path = "src/main.rs"

[features]
default = ["sync", "relay-client"]
sync = ["talos-base/sync"]
relay-client = ["talos-base/relay-client"]

[dependencies]
talos-base = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
