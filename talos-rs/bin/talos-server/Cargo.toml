[package]
name = "talos-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "talos-server"
path = "src/main.rs"

[features]
default = ["sync", "relay"]
sync = ["talos-base/sync"]
relay = ["talos-base/relay"]

[dependencies]
talos-base = { workspace = true, default-features = false, features = ["server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }

[lints]
workspace = true
