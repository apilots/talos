timezone: "Asia/Shanghai"

gateway:
  port: 8080
  host: "0.0.0.0"
  token: "talos-local-test-token"
  jwt_secret: ${JWT_SECRET}
  auth: false

agent:
  name: "talos"
  model: "kimi-k2.5"
  kernel:
    max_iters: 1
    max_task_per_turn: 3
    tool_parallelism: 1
    max_llm_calls: 8
    max_tool_rounds: 8
    tool_result_max_bytes: 65536
    context_compaction_max_bytes: 262144
    default_workspace_id: "default"
    planner_mode: "built_in"
    planner_selection: "auto"
    execution_mode: "single"
    execution_children: 2
    execution_loop_iters: 3
    prompt:
      window:
        reserved_output_tokens:
          kind: "use_model_default"
        compaction_buffer_tokens: 4096
      include_session_summary: true
      include_recent_messages: true
      session_recent_messages_limit: 24
      include_retrieved_memories: true
      session_summary_recent_count: 2
      session_summary_max_chars: 1200
      retrieved_memory_max_items: 4
      retrieved_memory_max_chars: 2000
      bootstrap:
        enabled: true
        auto_create_missing_files: true
        max_chars_per_file: 8000
        max_chars_total: 24000
        warning_mode: "once"
        include_agents: true
        include_soul: true
        include_identity: true
        include_user: true
        include_heartbeat: true
        include_memory: true
    memory:
      hot_recent_messages: 64
      compaction_threshold_bytes: 262144
      root_memory_filename: "MEMORY.md"
      memory_dirname: "memory"
      workspace_memory_flush_enabled: true
      workspace_memory_flush_on_compaction: true
      flush_file_pattern: "YYYY-MM-DD.md"
      tool_search_enabled: true
      tool_get_enabled: true
      search_max_results: 6
      file_list_default_limit: 20
      file_list_max_limit: 90
      search_include_root_memory: true
      search_include_daily_memory: true
      search_include_sessions: false

channels:
  whatsapp:
    enabled: false
  telegram:
    enabled: false
    token: ${TELEGRAM_BOT_TOKEN}
    allow_from: []
    dm_policy: "open"
    group_policy: "mention"
    group_allow_from: []
    dm_scope: "per_channel_peer_topic"
    mode: "polling"
    webhook_url: null
    accounts:
      - id: "telegram-default"
        enabled: false
        token: ${TELEGRAM_ACCOUNT_1_TOKEN}
        dm_policy: "open"
        group_policy: "mention"
        allow_from: []
        group_allow_from: []
        mode: "polling"
        webhook_url: ${TELEGRAM_ACCOUNT_1_WEBHOOK_URL}
        groups:
          - id: ${TELEGRAM_GROUP_ID}
            require_mention: true
            allow_from: []
            topics:
              - id: ${TELEGRAM_TOPIC_ID}
                require_mention: false
                allow_from: []
      - id: "telegram-webhook"
        enabled: false
        token: ${TELEGRAM_ACCOUNT_2_TOKEN}
        dm_policy: "open"
        group_policy: "mention"
        allow_from: []
        group_allow_from: []
        mode: "webhook"
        webhook_url: ${TELEGRAM_ACCOUNT_2_WEBHOOK_URL}
        groups: []
  discord:
    enabled: false
  feishu:
    enabled: false

