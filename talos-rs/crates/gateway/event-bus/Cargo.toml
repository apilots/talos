[package]
name = "talos-event-bus"
version = "0.1.0"
edition = "2021"

[dependencies]
talos-error = { path = "../../infra/error" }
talos-types = { path = "../../common/types" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
tokio-stream = { version = "0.1", features = ["sync"] }
crossbeam = "0.8"