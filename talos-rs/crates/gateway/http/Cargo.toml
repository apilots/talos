[package]
name = "talos-gateway-http"
version = "0.1.0"
edition = "2021"

[dependencies]
talos-gateway = { path = "../core" }
talos-application-service = { workspace = true }
talos-error = { path = "../../infra/error" }
talos-types = { path = "../../common/types" }
talos-auth = { path = "../../infra/auth" }
talos-config = { workspace = true }
talos-llm-provider = { workspace = true }
talos-session-store = { path = "../../orchestration/session-store" }
talos-app-protocol = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { workspace = true }
tokio-stream = "0.1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
talos-app-server = { workspace = true }
