[package]
name = "talos-gateway"
version = "0.1.3"
edition = "2021"

[dependencies]
talos-service = { workspace = true }
talos-auth = { path = "../../infra/auth" }
talos-config = { path = "../../infra/config" }
talos-error = { path = "../../infra/error" }
talos-types = { path = "../../common/types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
mockall = "0.12"
talos-coordinator = { path = "../../orchestration/coordinator" }
talos-llm-provider = { path = "../../common/llm/provider" }
talos-store = { workspace = true }
talos-storage = { path = "../../infra/storage" }
