[package]
name = "talos-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
talos-agent-api = { workspace = true }
talos-service = { workspace = true }
talos-auth = { path = "../../infra/auth" }
talos-config = { path = "../../infra/config" }
talos-error = { path = "../../infra/error" }
talos-types = { path = "../../common/types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { workspace = true }
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
mockall = "0.12"
opendal = { workspace = true, features = ["services-memory"] }
talos-agent = { path = "../../orchestration/agent" }
talos-agent-kernel = { workspace = true }
talos-agent-provider-kernel = { workspace = true }
talos-coordinator = { path = "../../orchestration/coordinator" }
talos-llm-provider = { path = "../../common/llm/provider" }
talos-memory = { workspace = true }
talos-router = { path = "../../orchestration/router" }
talos-store = { workspace = true }
talos-storage = { path = "../../infra/storage" }
talos-tools = { workspace = true }
talos-tools-policy = { workspace = true }
tempfile = "3"

[lints]
workspace = true
