[package]
name = "talos-gateway"
version = "0.1.2"
edition = "2021"

[dependencies]
talos-error = { path = "../../infra/error" }
talos-types = { path = "../../common/types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
mockall = "0.12"