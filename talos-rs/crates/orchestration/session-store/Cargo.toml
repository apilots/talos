[package]
name = "talos-session-store"
version = "0.1.2"
edition = "2021"

[dependencies]
talos-error = { path = "../../infra/error" }
talos-storage = { path = "../../infra/storage" }
talos-types = { path = "../../common/types" }
talos-project-store = { path = "../project-store" }
talos-llm-provider = { path = "../../common/llm/provider" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { workspace = true }
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
