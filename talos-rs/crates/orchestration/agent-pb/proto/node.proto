syntax = "proto3";
package talos.agent.v1;
import "types.proto";
import "auth.proto";
import "connection.proto";

service AgentNodeControl {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);
  rpc Connect(stream NodeToControlFrame) returns (stream ControlToNodeFrame);
}
// Existing Actor authentication and node ownership protect management methods.
service AgentNodeManagement {
  rpc DeleteComputer(GetNodeRequest) returns (DeleteComputerResponse);
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc GetDeployments(GetNodeRequest) returns (GetDeploymentsResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (GetNodeResponse);
  rpc RenameComputer(RenameComputerRequest) returns (GetNodeResponse);
  rpc SetComputerStatus(SetComputerStatusRequest) returns (GetNodeResponse);
  rpc RotateCredential(RotateCredentialRequest) returns (CredentialResponse);
}
enum NodeMode { NODE_MODE_UNSPECIFIED = 0; NODE_MODE_EMBEDDED = 1; NODE_MODE_REMOTE = 2; }
enum NodeStatus { NODE_STATUS_UNSPECIFIED = 0; NODE_STATUS_ENABLED = 1; NODE_STATUS_DISABLED = 2; }
enum NodeHealth { NODE_HEALTH_UNSPECIFIED = 0; NODE_HEALTH_UNKNOWN = 1; NODE_HEALTH_HEALTHY = 2; NODE_HEALTH_DEGRADED = 3; }
message Deployment { string agent_id = 1; }
message RegisterParams { repeated Deployment deployments = 1; NodeSystemInfo system_info = 2; }
message Registration {
  string lease_token = 1; LeaseValidity validity = 2; string owner_user_id = 3;
}
message RegisterRequest { NodeAuth auth = 1; RegisterParams params = 2; }
message RegisterResponse { oneof result { Registration registered = 1; Failure failure = 2; } }
message RenewLeaseRequest { NodeAuth auth = 1; Empty params = 2; }
message RenewLeaseResponse { oneof result { LeaseValidity renewed = 1; Failure failure = 2; } }
message HeartbeatParams { NodeHealth health = 1; }
message HeartbeatRequest { NodeAuth auth = 1; HeartbeatParams params = 2; }
message HeartbeatResult {
  int64 received_at = 1;
  // CP lost its in-memory Client/registration, e.g. after restart.
  bool registration_required = 2;
}
message HeartbeatResponse { oneof result { HeartbeatResult accepted = 1; Failure failure = 2; } }
message UnregisterRequest { NodeAuth auth = 1; Empty params = 2; }
message UnregisterResponse { oneof result { Empty completed = 1; Failure failure = 2; } }
message NodeInfo {
  string node_id = 1; string display_name = 2; NodeMode mode = 3;
  optional string endpoint = 4; NodeStatus status = 5; NodeHealth health = 6;
  optional int64 lease_expires_at = 7; optional int64 last_heartbeat_at = 8;
  int64 created_at = 9; int64 updated_at = 10;
  optional string owner_user_id = 11; bool available = 12;
  optional int64 credential_expires_at = 13;
  NodeSystemInfo system_info = 14;
}
message NodeCredential { string node_id = 1; string token = 2; int64 expires_at = 3; }
message CreateNodeRequest {
  // Identity is generated once by the control plane and returned in CreatedNode.
  reserved 1;
  string display_name = 2; optional string endpoint = 3;
  // Omitted means the authenticated caller; only an administrator may specify another user.
  optional string owner_user_id = 4; int64 credential_expires_at = 5;
}
message CreatedNode { NodeInfo node = 1; NodeCredential credential = 2; }
message CreateNodeResponse { oneof result { CreatedNode created = 1; Failure failure = 2; } }
message GetNodeRequest { string node_id = 1; }
message GetNodeResponse { oneof result { NodeInfo node = 1; Failure failure = 2; } }
message NodeDeployments { repeated Deployment deployments = 1; }
message GetDeploymentsResponse { oneof result { NodeDeployments deployments = 1; Failure failure = 2; } }
message ListNodesRequest { optional string cursor = 1; uint32 limit = 2; }
message NodePage { repeated NodeInfo data = 1; optional string next_cursor = 2; }
message ListNodesResponse { oneof result { NodePage page = 1; Failure failure = 2; } }
// Full replacement of mutable management fields; ownership is immutable.
message UpdateNodeRequest {
  string node_id = 1; string display_name = 2; optional string endpoint = 3;
  NodeStatus status = 4;
}
message RotateCredentialRequest { string node_id = 1; int64 expires_at = 2; }
message CredentialResponse { oneof result { NodeCredential credential = 1; Failure failure = 2; } }

// Narrow mutations reuse the product request semantics and avoid replacing unrelated fields.
message RenameComputerRequest { string node_id = 1; string display_name = 2; }
message SetComputerStatusRequest { string node_id = 1; NodeStatus status = 2; }

enum NodeOperatingSystem { NODE_OPERATING_SYSTEM_UNSPECIFIED = 0; NODE_OPERATING_SYSTEM_LINUX = 1; NODE_OPERATING_SYSTEM_MAC_OS = 2; }
message NodeNetworkInterface { string name = 1; string mac_address = 2; }
message NodeSystemInfo {
  NodeOperatingSystem os = 1; optional string os_version = 2; string architecture = 3;
  optional string hostname = 4; optional string cpu_model = 5; uint32 logical_cpu_count = 6;
  uint64 memory_bytes = 7; optional string board_model = 8;
  repeated NodeNetworkInterface network_interfaces = 9; repeated string graphics = 10;
  string worker_version = 11;
}

message DeleteComputerResponse { oneof result { string node_id = 1; Failure failure = 2; } }
