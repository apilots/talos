[package]
name = "talos-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
talos-browser.workspace = true
http = "1"
talos-logging = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
calamine = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
futures-util = { workspace = true }
infer = { workspace = true }
mime_guess = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
process-wrap = { version = "9.1.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
opendal = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
subtle = { workspace = true }
agent-protocol = { workspace = true }
agent-client = { workspace = true }
talos-auth = { workspace = true }
talos-agent-api = { workspace = true }
talos-agent = { workspace = true }
talos-config = { workspace = true }
talos-coordinator = { path = "../coordinator" }
talos-error = { workspace = true }
talos-fs = { workspace = true }
talos-llm-provider = { workspace = true }
talos-knowledge-format = { workspace = true }
talos-memory = { workspace = true }
talos-mcp = { workspace = true }
talos-plugin = { workspace = true }
talos-skills = { workspace = true }
talos-store = { workspace = true }
talos-sync = { workspace = true }
talos-types = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
opendal = { workspace = true, features = ["services-fs", "services-memory"] }
sqlx = { workspace = true }
talos-storage = { workspace = true }

[lints]
workspace = true
