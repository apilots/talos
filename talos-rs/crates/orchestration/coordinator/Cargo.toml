[package]
name = "talos-coordinator"
version = "0.1.0"
edition = "2021"

[dependencies]
talos-error = { path = "../../infra/error" }
talos-types = { path = "../../common/types" }
talos-agent = { path = "../agent" }
talos-llm-provider = { path = "../../common/llm/provider" }
talos-router = { path = "../router" }
talos-session-store = { path = "../session-store" }
talos-memory = { path = "../../cognition/memory" }
talos-config = { path = "../../infra/config" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
