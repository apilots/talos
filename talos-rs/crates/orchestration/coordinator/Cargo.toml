[package]
name = "talos-coordinator"
version = "0.1.3"
edition = "2021"

[dependencies]
talos-error = { path = "../../infra/error" }
talos-types = { path = "../../common/types" }
talos-agent = { path = "../agent" }
talos-router = { path = "../router" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
