[package]
name = "talos-base"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Native cross-project scenario; requires the separately built Sync binary.
[features]
default = ["sync", "relay-client"]
sync = ["dep:talos-sync", "dep:talos-sync-sdk", "dep:talos-sync-types", "talos-store/sync", "talos-service/sync", "talos-upgrade/sync"]
server = ["dep:talos-control-plane", "dep:talos-worker-runtime", "dep:talos-channel", "dep:axum-ws", "dep:axum-server", "talos-service/control-plane"]
relay = ["server", "dep:talos-relay-server"]
relay-client = ["dep:tower", "dep:tungstenite"]
e2e = ["sync", "server", "relay", "relay-client"]

[dependencies]
tower = { version = "0.4", features = ["util"], optional = true }
tungstenite = { version = "0.27", optional = true }
axum = "0.7"
axum-ws = { package = "axum", version = "0.8", features = ["ws"], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
prost.workspace = true
chrono = { workspace = true }
base64.workspace = true
talos-browser.workspace = true
talos-sync = { workspace = true, optional = true }
talos-sync-sdk = { workspace = true, optional = true }
talos-sync-types = { workspace = true, optional = true }
sha2 = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
reqwest-websocket = "0.5.1"
url = "2.5"
talos-app-protocol = { workspace = true }
talos-sdk.workspace = true
futures-util = { workspace = true }
async-trait = { workspace = true }
opendal = { workspace = true, features = ["reqwest-rustls-tls", "services-fs", "services-s3"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tonic = { workspace = true }
rustls = { workspace = true }
agent-pb = { workspace = true }
agent-client = { workspace = true }
agent-protocol = { workspace = true }
talos-agent = { path = "../../orchestration/agent" }
talos-agent-api = { workspace = true }
talos-service = { workspace = true, default-features = false, features = ["product"] }
talos-control-plane = { workspace = true, optional = true }
talos-relay-server = { workspace = true, optional = true }
talos-auth = { path = "../../infra/auth" }
talos-automation = { workspace = true }
talos-channel = { workspace = true, optional = true }
talos-config = { workspace = true }
talos-coordinator = { path = "../../orchestration/coordinator" }
talos-error = { workspace = true }
talos-fs = { workspace = true }
talos-app-server = { workspace = true }
talos-gateway = { path = "../../gateway/core" }
talos-gateway-http = { path = "../../gateway/http" }
talos-llm-provider = { workspace = true }
talos-logging = { workspace = true }
talos-memory = { workspace = true }
talos-router = { path = "../../orchestration/router" }
talos-store = { workspace = true }
talos-storage = { workspace = true }
talos-tools = { workspace = true }
talos-types = { workspace = true }
talos-worker-runtime = { workspace = true, optional = true }
talos-upgrade = { workspace = true }
talos-worker = { workspace = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
loro.workspace = true
tokio = { workspace = true, features = ["test-util"] }
talos-plugin = { workspace = true }
bytes = { workspace = true }
rcgen = "0.14"
talos-mcp = { workspace = true }
tempfile = "3"

[lints]
workspace = true
