[package]
name = "talos-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Talos - Configuration Management"
repository.workspace = true

[dependencies]
# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
schemars = { version = "0.8", features = ["derive"] }
ts-rs = "10.1"

# Config loading
config = "0.14"
infer = { workspace = true }

# Error handling
talos-error = { path = "../error" }
talos-fs = { workspace = true }

# Logging
talos-logging = { path = "../logging" }

# Utils
dirs = "5"
chrono-tz = { workspace = true }
croner = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
