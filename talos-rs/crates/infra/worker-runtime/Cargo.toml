[package]
name = "talos-worker-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Infrastructure lifecycle for managed Talos Workers"

[dependencies]
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-util = { workspace = true }
k8s-openapi = { version = "0.24", features = ["v1_28"] }
kube = { version = "0.98", default-features = false, features = ["client", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { workspace = true }

[lints]
workspace = true
