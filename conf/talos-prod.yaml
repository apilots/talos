      - id: "claude-haiku-5-5"
        name: "Claude Haiku 5.5"
        context_window: 1000000
        reasoning: true
        reasoning_effort: "medium"
        reasoning_efforts: ["light", "medium", "high", "xhigh", "max"]
        speed: "standard"
