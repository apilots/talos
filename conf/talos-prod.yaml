# One schema for Desktop, TUI, Server and Worker. Entrypoints assemble capabilities.
# All fields are structurally validated; external dependencies are needed only when enabled.
# Profile values may differ; optional groups stay null until explicitly configured.
# Derived logging.file, storage.connection_string and agent.kernel.timezone are not writable.
# See docs/development/DEVELOPMENT.md#runtime-configuration for ownership and upgrades.

# Common host configuration.
timezone: "Asia/Shanghai"

# Worker execution: local paths, memory, Harness, model catalog and tools belong to this host.
workspaces:
  default_workspace_id: "default"
  definitions:
    - workspace_id: "default"
      root_prefix: "workspace-talos"

memory:
  memory_dirname: "memory"
  file_list_default_limit: 20
  file_list_max_limit: 90

# Product management: local Desktop/TUI or cloud Server schedules and policies.
automation:
  profile_usage_retention:
    cron: "0 15 3 * * 1"
    retention_days: 366
    batch_size: 1000
    max_batches: 10
  dream_memory_maintenance:
    cron: "0 30 3 * * *"
    batch_size: 50
    max_batches: 10

# Shared production profile; the startup entrypoint selects host capabilities.

# Server control plane: authenticated product API. No local loopback RPC is required.
gateway:
  port: 8080
  host: "0.0.0.0"
  auth: true

agent_node:
  embedded_worker: true
  # Optional TLS listener example (paths/address are deployment inputs, not defaults):
  # control_plane: {bind_address: "0.0.0.0:9210", tls_certificate_file: "/run/talos/server.crt", tls_private_key_file: "/run/talos/server.key"}
  control_plane: null
  # Optional registered Worker example. Omitted/null transport selects outbound WSS.
  # Docker packaging explicitly selects direct; registration credentials stay in a protected file.
  # runner: {transport: outbound, node_id: "<registered-node-id>", control_plane_endpoint: "https://server.example.invalid:9210", credential_file: "/run/talos/worker.json", trusted_ca_file: null}
  runner: null

# Managed Talo Workers are opt-in on the authenticated Server.
talos:
  worker:
    # Optional Server-managed runtime: enable only with authenticated control-plane TLS.
    # image and control_plane_endpoint below are required deployment inputs, not defaults.
    # runtime:
    #   kind: DockerEngine  # DockerEngine | Kubernetes
    #   image: "<repository>@sha256:<64-hex-digest>"
    #   control_plane_endpoint: "https://server.example.invalid:9210"
    #   trusted_ca_file: null
    #   docker_engine:
    #     socket_path: /var/run/docker.sock
    #     worker: null  # Optional {image, control_plane_endpoint, trusted_ca_file: null} overrides the shared connection.
    #     resources: {cpu_cores: 4, memory_bytes: 8589934592, shm_bytes: 1073741824}
    #   kubernetes:
    #     namespace: default
    #     storage_class: talos-xfs-quota
    #     seccomp_profile: talos/chromium-seccomp.json
    #     worker: null  # Same connection override as docker_engine.worker.
    #     resources: {cpu_cores: 4, memory_bytes: 8589934592, shm_bytes: 1073741824}
    #     home_bytes: 100000000000
    #     home_quota_enforced: false  # Must be explicitly asserted after cluster verification.
    #     kubeconfig_source: null  # null: Mounted when a path is set, otherwise InCluster; also supports Pasted.
    #     kubeconfig_path: null
    #     kubeconfig_context: null
    #     pasted_kubeconfig: null  # Credential reference UUID; never inline credential contents.
    runtime: null
  server:
    runtime:
      idle_timeout_seconds: 900
      request_wait_seconds: 45
      start_timeout_seconds: 120
      wake_cooldown_seconds: 60

# Common product endpoints for authentication, registration and remote access; not local execution state.
cloud:
  api_base_url: "https://api.talos.love"
  agent_base_url: https://agent.talos.love
  agent_trusted_ca_file: null
  web_base_url: "https://cloud.talos.love"
  auth:
    introspection_cache_ttl_seconds: 300

fs:
  directory_picker:
    enabled: true
    root: "home"
    show_hidden: true

# Worker Harness configuration; message_queue and idempotency also define product admission policy.
agent:
  name: "talos"
  inner_model:
    provider: "deepseek"
    id: "deepseek-flash"
  kernel:
    tool_parallelism: 3
    tool_result_max_bytes: 65536
    context_compaction_max_bytes: 262144
    tools:
      environment:
        # Absolute directories on the Worker, in PATH precedence order.
        path_prepend: []
      enable_collaboration_tools: true
      sandbox_policy:
        user_permission_mode: "full_access"
        default_mode: "use_default"
        network: "use_default"
        platform:
          linux_helper_executable: null
      web_search:
        provider: "firecrawl"
        firecrawl:
          api_key: ${TALOS_WEB_SEARCH_FIRECRAWL_API_KEY}
          base_url: "https://api.firecrawl.dev"
          timeout_ms: 15000
        brave:
          api_key: ${TALOS_WEB_SEARCH_BRAVE_API_KEY}
          base_url: "https://api.search.brave.com/res/v1/web/search"
          timeout_ms: 15000
        tavily:
          api_key: ${TALOS_WEB_SEARCH_TAVILY_API_KEY}
          base_url: "https://api.tavily.com"
          timeout_ms: 15000
      dynamic:
        on_timeout: error_to_model
        response_timeout_ms: 300000
      enable_dynamic_tools: false
      enable_mcp_tools: true
      file:
        default_list_limit: 200
        default_read_limit: 200
        default_search_limit: 200
      bash:
        default_timeout_ms: 60000
        max_output_bytes: 65536
        output_log:
          max_file_bytes: 67108864
          max_workspace_bytes: 5368709120  # 5 GiB per user Workspace
          retention_days: 7
          cleanup_interval_secs: 3600  # Worker-owned hourly maintenance
      mcp_runtime:
        enable_resource_tools: true
        enable_tools: true
    skills:
      max_skill_md_bytes: 65536
      max_available_summary_bytes: 8192
    plugins:
      sources:
        - source_type: "official"
          display_name: "Apilots Skills"
          kind: "git"
          url: "https://github.com/apilots/skills"
          reference: "main"
          sparse_paths:
            - "skills"
        - source_type: official
          display_name: Apilots MCPs
          kind: git
          url: https://github.com/apilots/mcps
          reference: main
          sparse_paths:
            - mcp
      roots:
        - kind: "skill"
          path: "~/.agents/skills"
          read_only: true
        - kind: "skill"
          path: "~/.codex/skills"
          read_only: true
    planner_mode: "built_in"
    prompt:
      window:
        # Alternatives: {kind: use_model_default} or {kind: ratio, numerator: 1, denominator: 8}.
        # Ratio fields are required inputs; the shipped profile explicitly chooses fixed below.
        reserved_output_tokens:
          kind: "fixed"
          tokens: 8192
        compaction_buffer_tokens: 4096
      bootstrap:
        enabled: true
        auto_create_missing_files: true
        max_chars_per_file: 8000
        warning_mode: "once"
        include_agents: true
        include_soul: true
        include_identity: true
        include_user: true
        include_heartbeat: true
    output:
      max_tokens: 32000
      upper_limit: 64000
    compaction:
      trigger_ratio_percent: 85
      hard_ratio_percent: 95
      recent_messages_keep: 24
      recent_messages_max_chars: 4000
      compacted_recent_messages_keep: 2
      compacted_recent_messages_max_chars: 1200
      recent_summaries_keep: 2
      summary_max_chars: 1200
      compacted_summary_max_chars: 800
      source_recent_messages_limit: 48
      source_recent_tool_results_limit: 12
      tool_output_keep_last: 2
      tool_output_max_chars: 2000
      compacted_tool_output_max_chars: 600
      source_recent_tool_exchanges_limit: 12
      tool_exchange_keep_last: 2
      tool_exchange_max_chars: 600
      compacted_tool_exchange_max_chars: 300
      retrieved_memories_keep: 4
      retrieved_memory_max_chars: 2000
      compacted_retrieved_memory_max_chars: 800
      model: null
  # Optional Agent definition; provider:null inherits the shared Kernel config above.
  # agents:
  #   - {id: default, name: talos, enabled: true, description: null, provider: null}
  # A Kernel override uses provider: {type: kernel, kernel: {...}} with the complete
  # agent.kernel field set above and its typed defaults, not a separate config schema.
  # Explicit provider.kernel is a full override, not a merge; its timezone defaults
  # to UTC and is writable, whereas the root agent.kernel.timezone is derived.
  agents: []
  command_idempotency_ttl_hours: 24
  identity: null
  message_queue:
    max_messages_per_session: 10
    default_send_policy: queue
  subagent_admission:
    max_depth: 3
    max_active_turns: 20
  timeline_replay_batch_size: 1024

# Product management: optional messaging integrations; disabled channels do not require tokens.
channels:
  whatsapp:
    enabled: false
    allow_from: []
    dm_policy: open
    dm_scope: per_channel_peer_topic
    token: null
  telegram:
    enabled: false
    token: ${TALOS_TELEGRAM_BOT_TOKEN}
    allow_from: []
    dm_policy: "open"
    group_policy: "mention"
    group_allow_from: []
    dm_scope: "per_channel_peer_topic"
    mode: "polling"
    webhook_url: null
    accounts:
      - id: "telegram-default"
        enabled: false
        token: ${TALOS_TELEGRAM_ACCOUNT_1_TOKEN}
        dm_policy: "open"
        group_policy: "mention"
        allow_from: []
        group_allow_from: []
        mode: "polling"
        webhook_url: ${TALOS_TELEGRAM_ACCOUNT_1_WEBHOOK_URL}
        groups:
          - id: ${TALOS_TELEGRAM_GROUP_ID}
            require_mention: true
            allow_from: []
            topics:
              - id: ${TALOS_TELEGRAM_TOPIC_ID}
                require_mention: false
                allow_from: []
        token_file: null
      - id: "telegram-webhook"
        enabled: false
        token: ${TALOS_TELEGRAM_ACCOUNT_2_TOKEN}
        dm_policy: "open"
        group_policy: "mention"
        allow_from: []
        group_allow_from: []
        mode: "webhook"
        webhook_url: ${TALOS_TELEGRAM_ACCOUNT_2_WEBHOOK_URL}
        groups: []
        token_file: null
    webhook_secret: null
  discord:
    enabled: false
    allow_from: []
    dm_policy: open
    dm_scope: per_channel_peer_topic
    token: null
  feishu:
    enabled: false
    allow_from: []
    dm_policy: open
    dm_scope: per_channel_peer_topic
    token: null

# Worker model configuration: values are shared by native and embedded Worker APIs on this host.
# HTTP timeout defaults are explicit; null still selects the same adapter defaults.
# Model cost defaults are zero when not supplied; no model pricing is inferred.
# reasoning_efforts: null permits standard levels; [] disables graded effort.
llm:
  custom_providers: {}
  provider: "deepseek"
  model: "deepseek-flash"
  # Optional custom Provider example. Comments only; this endpoint is not usable.
  # Keep llm.provider, llm.model and agent.inner_model unchanged until configured.
  # custom_providers:
  #   example-connection:
  #     name: Example Connection
  #     protocol: chat
  #     base_url: https://llm.example.invalid/v1
  #     api_key: ${TALOS_LLM_CUSTOM_EXAMPLE_CONNECTION_API_KEY}
  #     http_timeouts:
  #       connect_secs: 10
  #       response_secs: 120
  #       stream_idle_secs: 90
  #       stream_total_secs: 900
  #     models:
  #       - id: example-model
  #         name: Example Model
  #         context_window: 131072
  #         reasoning: true
  #         reasoning_effort: medium
  #         # Accepted effort values; independent of enable_thinking. [] means no graded effort.
  #         reasoning_efforts: [light, medium, high]
  #         cost: {input: 0.0, output: 0.0, cache_read: 0.0, cache_write: 0.0}
  #         speed: standard
  #         input: [text]
  #         # Chat-only outgoing reasoning projection; this is not request KV.
  #         reasoning_replay: protocol_default
  #         # Use only extension fields accepted by your endpoint.
  #         request_parameters:
  #           chat_template_kwargs:
  #             enable_thinking: true
  anthropic:
    http_timeouts: {connect_secs: 10, response_secs: 120, stream_idle_secs: 90, stream_total_secs: 900}
    api_key: ${TALOS_LLM_ANTHROPIC_API_KEY}
    base_url: "https://api.anthropic.com/v1"
    protocol: "messages"
    # https://platform.claude.com/docs/en/models/overview
    # Adaptive thinking uses output_config.effort; max remains distinct from xhigh.
    models:
      - id: "claude-fable-5-2"
        name: "Claude Fable 5.2"
        context_window: 1000000
        reasoning: true
        reasoning_effort: "high"
        reasoning_efforts: ["light", "medium", "high", "xhigh", "max"]
        speed: "standard"
        input: ["text", "image", "file"]
        request_parameters:
          thinking:
            type: "adaptive"
        cost: {input: 8, output: 40, cache_read: 0.2, cache_write: 10}
        reasoning_replay: protocol_default
      - id: "claude-opus-5-5"
        name: "Claude Opus 5.5"
        context_window: 1000000
        reasoning: true
        reasoning_effort: "medium"
        reasoning_efforts: ["light", "medium", "high", "xhigh", "max"]
