timezone: Asia/Shanghai

workspaces:
  default_workspace_id: default
  definitions:
    - workspace_id: default
      root_prefix: workspace-talos

memory:
  memory_dirname: memory
  file_list_default_limit: 20
  file_list_max_limit: 90
automation:
  profile_usage_retention:
    cron: "0 15 3 * * 1"
    retention_days: 366
    batch_size: 1000
    max_batches: 10
  dream_memory_maintenance:
    cron: "0 30 3 * * *"
    batch_size: 50
    max_batches: 10
gateway:
  port: 8080
  host: 0.0.0.0
  auth: false
agent_node:
  control_plane: null
  runner: null
  # The embedded Worker uses authenticated loopback RPC, independently of Server registration.
  worker_rpc:
    bind_address: 127.0.0.1:0
    tls: null
cloud:
  api_base_url: http://127.0.0.1:8787
  agent_base_url: https://127.0.0.1:9210
  agent_trusted_ca_file: null
  web_base_url: http://127.0.0.1:3000
  auth:
    introspection_cache_ttl_seconds: 300
fs:
  directory_picker:
    enabled: true
    root: home
    show_hidden: true
agent:
  name: talos
  inner_model:
    provider: deepseek
    id: deepseek-v4-flash
  kernel:
    tool_parallelism: 3
    tool_result_max_bytes: 65536
    context_compaction_max_bytes: 262144
    tools:
      enable_collaboration_tools: true
      sandbox_policy:
        user_permission_mode: "full_access"
        default_mode: "use_default"
        network: "use_default"
        platform:
          linux_helper_executable: null
      web_search:
        provider: firecrawl
        firecrawl:
          api_key: ${TALOS_WEB_SEARCH_FIRECRAWL_API_KEY}
          base_url: https://api.firecrawl.dev
          timeout_ms: 15000
        brave:
          api_key: ${TALOS_WEB_SEARCH_BRAVE_API_KEY}
          base_url: https://api.search.brave.com/res/v1/web/search
          timeout_ms: 15000
        tavily:
          api_key: ${TALOS_WEB_SEARCH_TAVILY_API_KEY}
          base_url: https://api.tavily.com
          timeout_ms: 15000
      dynamic:
        on_timeout: error_to_model
        response_timeout_ms: 300000
      enable_dynamic_tools: false
      enable_mcp_tools: true
      file:
        default_list_limit: 200
        default_read_limit: 200
        default_search_limit: 200
      bash:
        default_timeout_ms: 60000
        max_output_bytes: 65536
        output_log:
          max_file_bytes: 67108864
          max_workspace_bytes: 5368709120  # 5 GiB per user Workspace
          retention_days: 7
          cleanup_interval_secs: 3600  # Worker-owned hourly maintenance
      mcp_runtime:
        enable_resource_tools: true
        enable_tools: true
    skills:
      max_skill_md_bytes: 65536
      max_available_summary_bytes: 8192
    plugins:
      sources:
      - source_type: official
        display_name: Apilots Skills
        kind: git
        url: https://github.com/apilots/skills
        reference: main
        sparse_paths:
        - skills
      roots:
      - kind: skill
        path: ~/.agents/skills
        read_only: true
      - kind: skill
        path: ~/.codex/skills
        read_only: true
    planner_mode: built_in
    # Browser is provisioned by the built-in plugin owner, not an on-demand npx server.
    mcp:
      servers: []
    prompt:
      window:
        reserved_output_tokens:
          kind: fixed
          tokens: 8192
        compaction_buffer_tokens: 4096
      bootstrap:
        enabled: true
        auto_create_missing_files: true
        max_chars_per_file: 8000
        warning_mode: once
        include_agents: true
        include_soul: true
        include_identity: true
        include_user: true
        include_heartbeat: true
    output:
      max_tokens: 32000
      upper_limit: 64000
    compaction:
      trigger_ratio_percent: 85
      hard_ratio_percent: 95
      recent_messages_keep: 24
      recent_messages_max_chars: 4000
      compacted_recent_messages_keep: 2
      compacted_recent_messages_max_chars: 1200
      recent_summaries_keep: 2
      summary_max_chars: 1200
      compacted_summary_max_chars: 800
      source_recent_messages_limit: 48
      source_recent_tool_results_limit: 12
      tool_output_keep_last: 2
      tool_output_max_chars: 2000
      compacted_tool_output_max_chars: 600
      source_recent_tool_exchanges_limit: 12
      tool_exchange_keep_last: 2
      tool_exchange_max_chars: 600
      compacted_tool_exchange_max_chars: 300
      retrieved_memories_keep: 4
      retrieved_memory_max_chars: 2000
      compacted_retrieved_memory_max_chars: 800
      model: null
  agents: []
  command_idempotency_ttl_hours: 24
  identity: null
  message_queue:
    max_messages_per_session: 10
  timeline_replay_batch_size: 1024
channels:
  whatsapp:
    enabled: false
    allow_from: []
    dm_policy: open
    dm_scope: per_channel_peer_topic
    token: null
  telegram:
    enabled: false
    token: ${TALOS_TELEGRAM_BOT_TOKEN}
    allow_from: []
    dm_policy: open
    group_policy: mention
    group_allow_from: []
    dm_scope: per_channel_peer_topic
    mode: polling
    webhook_url: null
    accounts:
    - id: telegram-default
      enabled: false
      token: ${TALOS_TELEGRAM_ACCOUNT_1_TOKEN}
      dm_policy: open
      group_policy: mention
      allow_from: []
      group_allow_from: []
      mode: polling
      webhook_url: ${TALOS_TELEGRAM_ACCOUNT_1_WEBHOOK_URL}
      groups:
      - id: ${TALOS_TELEGRAM_GROUP_ID}
        require_mention: true
        allow_from: []
        topics:
        - id: ${TALOS_TELEGRAM_TOPIC_ID}
          require_mention: false
          allow_from: []
    - id: telegram-webhook
      enabled: false
      token: ${TALOS_TELEGRAM_ACCOUNT_2_TOKEN}
      dm_policy: open
      group_policy: mention
      allow_from: []
      group_allow_from: []
      mode: webhook
      webhook_url: ${TALOS_TELEGRAM_ACCOUNT_2_WEBHOOK_URL}
      groups: []
    webhook_secret: null
  discord:
    enabled: false
    allow_from: []
    dm_policy: open
    dm_scope: per_channel_peer_topic
    token: null
  feishu:
    enabled: false
    allow_from: []
    dm_policy: open
    dm_scope: per_channel_peer_topic
    token: null
