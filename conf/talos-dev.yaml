logging:
  level: info
  format: text
  stdout: true
  # Exact dependency target thresholds; set this entry to info for codec diagnostics.
  target_levels:
    loro_internal::oplog::change_store::block_encode: warn
  # Use root timezone for timestamps and daily rotation.
  # Rotate on a calendar-day change OR the size threshold.
  # Keep logs/talos.log plus four library-managed numbered archives.
  # Complete records may exceed max_bytes. Set rotation: null to disable.
  rotation:
    max_bytes: 20971520
    max_files: 5

storage:
  database_type: sqlite
  max_connections: 5
  files:
    default: "local"
    backends:
      local:
        type: "fs"
        # Relative FS roots resolve under $TALOS_HOME/data.
        root: "files"
      # S3-compatible backend example. Credentials resolve from $TALOS_HOME/.env.
      # Uncomment this block and set `default: "s3"` to route new uploads to S3.
      # s3:
      #   type: "s3"
      #   # S3 root is a bucket prefix, not a local path; the leading slash is optional.
      #   root: "/talos-files"
      #   bucket: "talos-files"
      #   region: "us-east-1"
      #   endpoint: "https://s3.example.com"
      #   access_key_id: "${TALOS_FILE_S3_ACCESS_KEY_ID}"
      #   secret_access_key: "${TALOS_FILE_S3_SECRET_ACCESS_KEY}"
    limits:
      max_upload_bytes: 52428800
      max_files_per_turn: 5
      max_turn_file_bytes: 20971520
      max_filename_bytes: 255
      max_tags: 20
      max_tag_bytes: 64
      max_metadata_entries: 32
      max_metadata_key_bytes: 64
      max_metadata_value_bytes: 2048
      max_metadata_bytes: 8192
    allowed_mime_types:
      - "application/msword"
      - "application/pdf"
      - "application/vnd.ms-excel"
      - "image/png"
      - "image/jpeg"
      - "image/webp"
      - "text/csv"
      - "text/markdown"
      - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      - "application/vnd.openxmlformats-officedocument.presentationml.presentation"

# Account data sharing is independent of Worker RPC and registration.
sync:
  enabled: false
  hub_endpoint: wss://127.0.0.1:9220/v1/sync
  trusted_ca_file: null
