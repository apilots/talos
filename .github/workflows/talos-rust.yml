name: talos-rust

concurrency:
  group: talos-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - "talos-rs/**"
      - "contracts/talos-sync/**"
      - "scripts/sync-metrics-contract.py"
      - "scripts/check_error_contract*.py"
      - "justfile"
      - ".github/workflows/talos-rust.yml"

permissions:
  contents: read

jobs:
  change-scope:
    name: Check Rust change scope
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.scope.outputs.run_workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether Rust checks apply
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/pr_change_scope.py rust

  rust-quality:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.run_workflow == 'true') }}
    name: rust-format-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Talos
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install just and scoped test runner
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Install Protocol Buffer compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check error contract guardrails
        run: |
          python3 scripts/check_error_contract_tests.py
          python3 scripts/check_error_contract.py

      - name: Check Rust formatting
        run: just fmt-check

      - name: Check Rust workspace
        run: just check

      - name: Verify Sync metrics contract and client boundaries
        run: |
          python3 scripts/sync-metrics-contract.py --check
          just test -p talos-sync -p talos-app-protocol -p talos-sdk
