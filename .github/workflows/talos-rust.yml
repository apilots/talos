name: talos-rust

concurrency:
  group: talos-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - "talos-rs/**"
      - "scripts/check_error_contract*.py"
      - "justfile"
      - ".github/workflows/talos-rust.yml"

permissions:
  contents: read

jobs:
  rust-quality:
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    name: rust-format-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Talos
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Protocol Buffer compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check error contract guardrails
        run: |
          python3 scripts/check_error_contract_tests.py
          python3 scripts/check_error_contract.py

      - name: Check Rust formatting
        run: just fmt-check

      - name: Check Rust workspace
        run: just check
