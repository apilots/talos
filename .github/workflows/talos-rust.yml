name: CI · Server, client, SDK, skills, MCP and tools
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      mcp:
        type: boolean
        required: true
permissions:
  contents: read
  actions: read
jobs:
  checks:
    name: Server · affected modules
    uses: ./.github/workflows/ci-category.yml
    with:
      plan: ${{ inputs.plan }}
  mcp-native:
    name: MCP · native macOS process cleanup
    if: inputs.mcp
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CI_TASK: '{"name":"mcp-native-macos","kind":"mcp","rust":["talos-mcp"],"frontend":[],"binaries":[]}'
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: ./.github/actions/ci-cache
        with:
          task: ${{ env.CI_TASK }}
      - if: steps.cache.outputs.hit != 'true'
        run: cat .github/release-toolchain.env >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        if: steps.cache.outputs.hit != 'true'
        with:
          toolchain: ${{ env.RELEASE_RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        if: steps.cache.outputs.hit != 'true'
        with:
          workspaces: talos-rs
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}-${{ env.RELEASE_RUST_VERSION }}-debug
      - uses: taiki-e/install-action@v2
        if: steps.cache.outputs.hit != 'true'
        with:
          tool: just,cargo-nextest
      - name: Check native MCP lifecycle through just
        if: steps.cache.outputs.hit != 'true'
        env:
          CI_CACHE_KEY: ${{ steps.cache.outputs.key }}
          CI_CACHE_DIR: ${{ steps.cache.outputs.path }}
        run: python3 .github/scripts/ci_run.py run
