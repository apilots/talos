name: Dispatch release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  validate-installation:
    name: Validate native installation
    uses: ./.github/workflows/talos-tui-install.yml
    with:
      run_native: true
    secrets: inherit

  dispatch:
    name: Dispatch release build
    needs:
      - validate-installation
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch talos-releases workflow
        env:
          GH_TOKEN: ${{ secrets.TALOS_RELEASES_DISPATCH_TOKEN }}
          RELEASE_REPOSITORY: apilots/talos-releases
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "TALOS_RELEASES_DISPATCH_TOKEN is required." >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          if [[ -z "${VERSION}" || "${VERSION}" == "${TAG_NAME}" ]]; then
            echo "Release tags must use the v* format." >&2
            exit 1
          fi

          jq -n \
            --arg tag "${TAG_NAME}" \
            --arg version "${VERSION}" \
            '{
              event_type: "talos_release",
              client_payload: {
                tag: $tag,
                version: $version
              }
            }' > dispatch.json

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${RELEASE_REPOSITORY}/dispatches" \
            --data @dispatch.json
