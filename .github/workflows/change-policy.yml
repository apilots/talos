name: change-policy

on:
  workflow_dispatch:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changed-files:
    name: changed-file-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve comparison range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ -n "${PUSH_BASE_SHA}" && "${PUSH_BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BASE_SHA}"
          else
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "head=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          if git diff --quiet "$base" "$HEAD_SHA" -- build/server build/worker .github/workflows/release.yml; then
            echo "docker_checks=false" >> "$GITHUB_OUTPUT"
          else
            echo "docker_checks=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$base" "$HEAD_SHA" -- deploy/docker deploy/caddy deploy/nginx deploy/tests .github/workflows/change-policy.yml; then
            echo "server_checks=false" >> "$GITHUB_OUTPUT"
          else
            echo "server_checks=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test repository policy scripts
        run: |
          python3 -m unittest discover -s scripts -p 'check_changed_files_tests.py'
          python3 -m unittest discover -s .github/scripts -p '*_test.py'
          python3 -m py_compile .github/scripts/pr_change_scope.py
          scripts/check-commit-message-tests.sh
          scripts/generate-release-notes-tests.sh
          bash scripts/check-release-version-tests.sh
          bash -n .githooks/* scripts/*.sh

      - name: Validate actual version metadata
        run: bash scripts/check-release-version.sh --metadata

      - name: Check commit subjects
        run: >-
          scripts/check-commit-message.sh
          --range "${{ steps.range.outputs.base }}"
          "${{ steps.range.outputs.head }}"

      - name: Install workflow linter
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$tool_dir"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl -fsSL "$base/$archive" -o "$tool_dir/$archive"
          curl -fsSL "$base/$checksums" -o "$tool_dir/$checksums"
          (cd "$tool_dir" && sha256sum --check --ignore-missing "$checksums")
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" actionlint
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Validate workflow syntax
        run: actionlint .github/workflows/*.yml

      - name: Validate Docker configurations without building images
        if: ${{ steps.range.outputs.docker_checks == 'true' }}
        run: |
          set -euo pipefail
          for product in server worker; do
            for stage in source packaged; do
              docker buildx build --check --build-arg "PRODUCT_STAGE=${stage}" \
                --file "build/${product}/Dockerfile" ..
            done
          done

      - name: Check changed files
        run: >-
          python3 scripts/check_changed_files.py
          --base "${{ steps.range.outputs.base }}"
          --head "${{ steps.range.outputs.head }}"

      - name: Validate Server and Worker Compose examples without starting containers
        if: ${{ steps.range.outputs.server_checks == 'true' }}
        run: bash deploy/tests/compose_examples_check.sh

      - name: Verify published Talos Server startup and HTTPS proxy
        if: ${{ steps.range.outputs.server_checks == 'true' }}
        run: bash deploy/tests/talos_server_smoke.sh
