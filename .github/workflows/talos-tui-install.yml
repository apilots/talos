name: CI · installer contracts
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installer-tests:
    if: ${{ !cancelled() }}
    name: Installer · shell and archive contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Talos
        uses: actions/checkout@v6

      - name: Check shell syntax
        run: |
          sh -n deploy/install/install.sh
          bash -n deploy/install/tests/*.sh talos-e2e/tests/*.sh talos-e2e/scripts/tui_install.sh talos-e2e/scenarios/15_tui_install/*.sh

      - name: Test installer
        run: |
          deploy/install/tests/install_test.sh
          deploy/install/tests/release_contract_test.sh
          talos-e2e/tests/tui_install_target_test.sh
