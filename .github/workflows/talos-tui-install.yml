name: talos-tui-install

concurrency:
  group: talos-tui-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  change-scope:
    name: Check installer change scope
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.scope.outputs.run_workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether installer checks apply
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/pr_change_scope.py tui-install

  installer-tests:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.run_workflow == 'true') }}
    name: Installer shell tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Talos
        uses: actions/checkout@v6

      - name: Check shell syntax
        run: |
          sh -n deploy/install/install.sh
          bash -n deploy/install/tests/*.sh talos-e2e/tests/*.sh talos-e2e/scripts/tui_install.sh talos-e2e/scenarios/15_tui_install/*.sh

      - name: Test installer
        run: |
          deploy/install/tests/install_test.sh
          deploy/install/tests/release_contract_test.sh
          talos-e2e/tests/tui_install_target_test.sh

  native-install-e2e:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.run_workflow == 'true') }}
    name: Install ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout Talos
        uses: actions/checkout@v6

      - name: Load shared toolchain versions
        run: cat .github/release-toolchain.env >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RELEASE_RUST_VERSION }}

      - name: Install Protocol Buffer compiler
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            brew install protobuf
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-rs
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}-${{ env.RELEASE_RUST_VERSION }}-release

      - name: Fetch native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked --manifest-path talos-rs/Cargo.toml; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done

      - name: Run native installation E2E case
        env:
          CARGO_NET_OFFLINE: "true"
          TUI_INSTALL_EXPECTED_PLATFORM: ${{ matrix.platform }}
          TUI_INSTALL_EXPECTED_ARCH: ${{ matrix.arch }}
        run: talos-e2e/run_e2e.sh --case 15_tui_install/01_native_install

      - name: Upload native installation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-install-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            talos-e2e/reports/e2e_report_*.md
            talos-e2e/reports/15_tui_install/01_native_install/
          if-no-files-found: warn
          retention-days: 7

  linux-docker-install-e2e:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.run_workflow == 'true') }}
    name: Linux Docker installer E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Talos
        uses: actions/checkout@v6

      - name: Run Linux Docker installation scenario
        run: talos-e2e/run_e2e.sh --case 15_tui_install/02_linux_docker

      - name: Upload Linux Docker installation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-install-linux-docker
          path: |
            talos-e2e/reports/e2e_report_*.md
            talos-e2e/reports/15_tui_install/02_linux_docker/
          if-no-files-found: warn
          retention-days: 7

  gate:
    if: ${{ always() }}
    name: talos-tui-install-gate
    runs-on: ubuntu-latest
    needs:
      - change-scope
      - installer-tests
      - native-install-e2e
      - linux-docker-install-e2e
    steps:
      - name: Require every installer check
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          RUN_INSTALLER: ${{ needs.change-scope.outputs.run_workflow }}
          INSTALLER_TESTS: ${{ needs.installer-tests.result }}
          NATIVE_INSTALL: ${{ needs.native-install-e2e.result }}
          DOCKER_INSTALL: ${{ needs.linux-docker-install-e2e.result }}
        run: |
          set -euo pipefail
          if [[ "${SCOPE_RESULT}" != "success" ]]; then
            echo "Could not determine installer change scope." >&2
            exit 1
          fi
          if [[ "${RUN_INSTALLER}" != "true" ]]; then
            echo "No installer inputs changed; installer acceptance is not applicable."
            exit 0
          fi
          for result in "${INSTALLER_TESTS}" "${NATIVE_INSTALL}" "${DOCKER_INSTALL}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Installer acceptance did not pass: ${result}" >&2
              exit 1
            fi
          done
          echo "Installer shell, native-platform, and Linux Docker checks passed."
