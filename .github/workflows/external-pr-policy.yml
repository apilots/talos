name: External PR policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

jobs:
  close-untrusted:
    runs-on: ubuntu-latest
    steps:
      - name: Close pull requests from outside contributors
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          case "${AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Trusted pull request author: ${AUTHOR_ASSOCIATION}."
              exit 0
              ;;
          esac

          gh pr close "${PR_NUMBER}" --repo "${REPOSITORY}" \
            --comment "This repository does not accept pull requests from outside collaborators."
