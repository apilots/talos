name: talos-frontend-app

concurrency:
  group: talos-frontend-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  change-scope:
    name: Check frontend change scope
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.scope.outputs.run_workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether frontend checks apply
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/pr_change_scope.py frontend

  frontend-app-quality:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.run_workflow == 'true') }}
    name: frontend-app-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: talos-app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load shared toolchain versions
        working-directory: .
        run: cat .github/release-toolchain.env >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.RELEASE_PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: talos-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend app checks
        run: pnpm ci:frontend-app
