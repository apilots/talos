name: Talos CI · module gates
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: talos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    if: ${{ !cancelled() }}
    name: Detect · module and dependency changes
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      build: ${{ steps.scope.outputs.build }}
      tests: ${{ steps.scope.outputs.tests }}
      webui: ${{ steps.scope.outputs.webui }}
      desktop: ${{ steps.scope.outputs.desktop }}
      tui: ${{ steps.scope.outputs.tui }}
      server: ${{ steps.scope.outputs.server }}
      installer: ${{ steps.scope.outputs.installer }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select union of affected module checks
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/pr_change_scope.py ci
  build:
    name: Build · shared E2E binaries
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.build == 'true') }}
    uses: ./.github/workflows/ci-build.yml
    with:
      task: ${{ toJSON(fromJSON(needs.scope.outputs.plan).build) }}
  tests:
    name: Build · shared Rust tests
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.tests == 'true') }}
    uses: ./.github/workflows/ci-build.yml
    with:
      task: ${{ toJSON(fromJSON(needs.scope.outputs.plan).test_build) }}
  webui:
    name: WebUI
    needs: [scope, build]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.webui == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/talos-webui.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.scope.outputs.plan).categories.webui) }}
  desktop:
    name: Desktop
    needs: [scope, build]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.desktop == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/talos-desktop.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.scope.outputs.plan).categories.desktop) }}
  tui:
    name: TUI
    needs: [scope, build, tests]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.tui == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    uses: ./.github/workflows/talos-tui.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.scope.outputs.plan).categories.tui) }}
  server:
    name: Server · client / SDK / skills / MCP / tools / runtime
    needs: [scope, build, tests]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.server == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    uses: ./.github/workflows/talos-rust.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.scope.outputs.plan).categories.server) }}
      mcp: ${{ fromJSON(needs.scope.outputs.plan).mcp }}
  installer:
    name: Installer · lightweight contracts
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.installer == 'true') }}
    uses: ./.github/workflows/talos-tui-install.yml
  harness:
    name: E2E infrastructure · lifecycle and fixtures
    needs: scope
    if: ${{ !cancelled() && (fromJSON(needs.scope.outputs.plan).harness) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_TASK: '{"name":"e2e-harness","kind":"harness","rust":[],"frontend":[],"binaries":[]}'
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: ./.github/actions/ci-cache
        with:
          task: ${{ env.CI_TASK }}
      - uses: actions/setup-python@v6
        if: steps.cache.outputs.hit != 'true'
        with:
          python-version: '3.12'
      - name: Install declared fixture dependencies
        if: steps.cache.outputs.hit != 'true'
        run: python -m pip install --disable-pip-version-check -r talos-e2e/scripts/browser-worker/requirements.txt
      - name: Test runner and fixture contracts
        if: steps.cache.outputs.hit != 'true'
        env:
          CI_CACHE_KEY: ${{ steps.cache.outputs.key }}
          CI_CACHE_DIR: ${{ steps.cache.outputs.path }}
        run: python3 .github/scripts/ci_run.py run
  frontend-gate:
    name: frontend-app-quality
    if: ${{ !cancelled() }}
    needs: [scope, webui, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require every selected frontend check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ needs.scope.outputs.plan }}
        run: python3 .github/scripts/ci_gate.py frontend
  rust-gate:
    name: rust-format-and-check
    if: ${{ !cancelled() }}
    needs: [scope, server, tui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require every selected rust check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ needs.scope.outputs.plan }}
        run: python3 .github/scripts/ci_gate.py rust
  e2e-gate:
    name: talos-pr-e2e
    if: ${{ !cancelled() }}
    needs: [scope, build, tests, webui, desktop, server, tui, harness]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require every selected e2e check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ needs.scope.outputs.plan }}
        run: python3 .github/scripts/ci_gate.py e2e
  installer-gate:
    name: talos-tui-install-gate
    if: ${{ !cancelled() }}
    needs: [scope, installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require every selected installer check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ needs.scope.outputs.plan }}
        run: python3 .github/scripts/ci_gate.py installer
