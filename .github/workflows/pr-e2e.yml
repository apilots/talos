name: Talos PR E2E

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talos-pr-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: E2E ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: core
            runner: ubuntu-24.04
            targets: |
              case:01_health_and_models
              case:02_session_lifecycle
              case:03_messages_http_sse
              group:05_cli
              group:06_tools
              group:07_memory
              group:08_tui
          - name: app-and-integration
            runner: ubuntu-24.04
            targets: |
              group:09_app_server
              group:10_talos_app
              group:11_auth
              group:12_files
          - name: interaction
            runner: ubuntu-24.04
            targets: |
              group:13_interaction
          - name: sandbox
            runner: ubuntu-24.04
            targets: |
              group:14_sandbox
          - name: multi-node
            runner: ubuntu-24.04
            targets: |
              group:17_multi_node
          - name: computer-workspace
            runner: macos-26
            targets: |
              group:18_computer_workspace

    env:
      TALOS_CLOUD_REPO: ${{ github.workspace }}/talos-cloud
      TALOS_LLM_DEEPSEEK_API_KEY: ${{ secrets.TALOS_LLM_DEEPSEEK_API_KEY }}
      TALOS_WEB_SEARCH_FIRECRAWL_API_KEY: ${{ secrets.TALOS_WEB_SEARCH_FIRECRAWL_API_KEY }}
      TALOS_WEB_SEARCH_TAVILY_API_KEY: ${{ secrets.TALOS_WEB_SEARCH_TAVILY_API_KEY }}

    steps:
      - name: Check out Talos
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap build-essential curl libssl-dev pkg-config \
            protobuf-compiler ripgrep sqlite3 tmux xvfb
          # The disposable Ubuntu runner must permit bubblewrap user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / true

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install caddy curl protobuf
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-rs
          cache-on-failure: true

      - name: Install just and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python scenario dependencies
        run: python -m pip install --disable-pip-version-check grpcio protobuf pyyaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.14.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: talos-app/pnpm-lock.yaml

      - name: Install application dependencies
        run: pnpm --dir talos-app install --frozen-lockfile

      - name: Check out Talos Cloud for owned integration scenarios
        if: contains(matrix.targets, 'group:11_auth') || contains(matrix.targets, 'group:17_multi_node') || contains(matrix.targets, 'group:18_computer_workspace')
        uses: actions/checkout@v6
        with:
          repository: apilots/talos-cloud
          ref: main
          path: talos-cloud
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN }}

      - name: Install Chrome for Linux MCP E2E
        id: chrome
        if: runner.os == 'Linux'
        uses: browser-actions/setup-chrome@v1

      - name: Run existing E2E scenarios (group 19 is local-only)
        shell: bash
        env:
          E2E_TARGETS: ${{ matrix.targets }}
          TALOS_PLAYWRIGHT_MCP_BROWSER: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' }}
          TALOS_E2E_CHROME_BIN: ${{ runner.os == 'Linux' && steps.chrome.outputs.chrome-path || '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' }}
        run: |
          set -euo pipefail
          if [[ -z "${TALOS_LLM_DEEPSEEK_API_KEY}" ]]; then
            echo "TALOS_LLM_DEEPSEEK_API_KEY Actions secret is required for the existing real-provider E2E scenarios." >&2
            exit 1
          fi
          if grep -q '^group:06_tools$' <<<"${E2E_TARGETS}" \
            && { [[ -z "${TALOS_WEB_SEARCH_FIRECRAWL_API_KEY}" ]] || [[ -z "${TALOS_WEB_SEARCH_TAVILY_API_KEY}" ]]; }; then
            echo "Firecrawl and Tavily Actions secrets are required for group 06." >&2
            exit 1
          fi
          scenario_result=0
          while IFS= read -r target; do
            [[ -n "${target}" ]] || continue
            kind="${target%%:*}"
            value="${target#*:}"
            if [[ "${kind}" == "group" ]]; then
              if [[ "${value}" == "14_sandbox" ]]; then
                docker info >/dev/null
              fi
              if [[ "${RUNNER_OS}" == "Linux" ]]; then
                xvfb-run -a ./talos-e2e/run_e2e.sh --group "${value}" || scenario_result=1
              else
                ./talos-e2e/run_e2e.sh --group "${value}" || scenario_result=1
              fi
            else
              if [[ "${RUNNER_OS}" == "Linux" ]]; then
                xvfb-run -a ./talos-e2e/run_e2e.sh --case "${value}" || scenario_result=1
              else
                ./talos-e2e/run_e2e.sh --case "${value}" || scenario_result=1
              fi
            fi
          done <<<"${E2E_TARGETS}"
          exit "${scenario_result}"

      - name: Show redacted failed-scenario diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          secrets = [value for key, value in os.environ.items()
                     if re.search(r"KEY|TOKEN|PASSWORD|SECRET", key) and len(value) >= 8]
          def redact(text):
              for secret in sorted(secrets, key=len, reverse=True):
                  text = text.replace(secret, "<redacted>")
              text = re.sub(r"(?i)(bearer\s+)\S+", r"\1<redacted>", text)
              text = re.sub(r"eyJ[\w-]+\.[\w-]+\.[\w-]+", "<redacted>", text)
              text = re.sub(r"(?i)([\"']?(?:\w*(?:token|password|secret|api_?key|credentials?)\w*)"
                            r"[\"']?\s*[:=]\s*)([\"'])(.*?)\2", r"\1\2<redacted>\2", text)
              return text

          for report in sorted(Path("talos-e2e/reports").glob("e2e_report_*.md")):
              for section in report.read_text(errors="replace").split("### 场景 ")[1:]:
                  if "- 状态: FAIL\n" not in section:
                      continue
                  name = section.splitlines()[0]
                  log = section.split("```text\n", 1)[-1].rsplit("```", 1)[0]
                  print(f"Failed scenario: {name}")
                  print(redact("\n".join(log.splitlines()[-80:])))
          for artifact in sorted(Path(".tmp/desktop-smoke").glob("*/desktop-smoke-error.log")):
              print(f"Desktop startup diagnostics: {artifact}")
              print(redact("\n".join(artifact.read_text(errors="replace").splitlines()[-80:])))
          PY

  gate:
    if: ${{ always() }}
    name: talos-pr-e2e
    runs-on: ubuntu-latest
    needs: scenarios
    steps:
      - name: Require every existing E2E shard
        env:
          RESULT: ${{ needs.scenarios.result }}
        run: |
          if [[ "${RESULT}" != "success" ]]; then
            echo "Existing E2E scenarios did not all pass: ${RESULT}" >&2
            exit 1
          fi
          echo "All pre-existing E2E groups passed. Group 19 remains a local acceptance group."
