name: Talos PR E2E

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talos-pr-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'COLLABORATOR') }}
    name: E2E ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: core
            runner: ubuntu-24.04
            targets: |
              case:01_health_and_models
              case:02_session_lifecycle
              case:03_messages_http_sse
              group:05_cli
              group:06_tools
              group:07_memory
              group:08_tui
          - name: app-and-integration
            runner: ubuntu-24.04
            targets: |
              group:09_app_server
              group:10_talos_app
              group:11_auth
              group:12_files
              group:13_interaction
              group:14_sandbox
          - name: multi-node
            runner: ubuntu-24.04
            targets: |
              group:17_multi_node
          - name: computer-workspace
            runner: macos-26
            targets: |
              group:18_computer_workspace

    env:
      TALOS_CLOUD_REPO: ${{ github.workspace }}/talos-cloud
      TALOS_LLM_DEEPSEEK_API_KEY: ${{ secrets.TALOS_LLM_DEEPSEEK_API_KEY }}
      TALOS_WEB_SEARCH_FIRECRAWL_API_KEY: ${{ secrets.TALOS_WEB_SEARCH_FIRECRAWL_API_KEY }}
      TALOS_WEB_SEARCH_TAVILY_API_KEY: ${{ secrets.TALOS_WEB_SEARCH_TAVILY_API_KEY }}

    steps:
      - name: Check out Talos
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap build-essential curl libssl-dev pkg-config \
            protobuf-compiler sqlite3 tmux xvfb

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install caddy protobuf

      - name: Install MinIO client for Linux S3 E2E
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          sudo install -m 0755 /tmp/mc /usr/local/bin/mc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-rs

      - name: Install just and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python scenario dependencies
        run: python -m pip install --disable-pip-version-check grpcio protobuf pyyaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.14.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: talos-app/pnpm-lock.yaml

      - name: Install application dependencies
        run: pnpm --dir talos-app install --frozen-lockfile

      - name: Check out Talos Cloud for owned integration scenarios
        if: contains(matrix.targets, 'group:11_auth') || contains(matrix.targets, 'group:17_multi_node') || contains(matrix.targets, 'group:18_computer_workspace')
        uses: actions/checkout@v6
        with:
          repository: apilots/talos-cloud
          ref: main
          path: talos-cloud
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN }}

      - name: Install Chrome for Linux MCP E2E
        if: runner.os == 'Linux'
        uses: browser-actions/setup-chrome@v1

      - name: Run existing E2E scenarios (group 19 is local-only)
        shell: bash
        env:
          E2E_TARGETS: ${{ matrix.targets }}
          TALOS_PLAYWRIGHT_MCP_BROWSER: ${{ runner.os == 'Linux' && 'google-chrome' || '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' }}
          TALOS_E2E_CHROME_BIN: ${{ runner.os == 'Linux' && 'google-chrome' || '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' }}
        run: |
          set -euo pipefail
          if [[ -z "${TALOS_LLM_DEEPSEEK_API_KEY}" ]]; then
            echo "TALOS_LLM_DEEPSEEK_API_KEY Actions secret is required for the existing real-provider E2E scenarios." >&2
            exit 1
          fi
          if grep -q '^group:06_tools$' <<<"${E2E_TARGETS}" \
            && { [[ -z "${TALOS_WEB_SEARCH_FIRECRAWL_API_KEY}" ]] || [[ -z "${TALOS_WEB_SEARCH_TAVILY_API_KEY}" ]]; }; then
            echo "Firecrawl and Tavily Actions secrets are required for group 06." >&2
            exit 1
          fi
          while IFS= read -r target; do
            [[ -n "${target}" ]] || continue
            kind="${target%%:*}"
            value="${target#*:}"
            if [[ "${kind}" == "group" ]]; then
              if [[ "${value}" == "14_sandbox" ]]; then
                docker info >/dev/null
              fi
              if [[ "${RUNNER_OS}" == "Linux" ]]; then
                xvfb-run -a ./talos-e2e/run_e2e.sh --group "${value}"
              else
                ./talos-e2e/run_e2e.sh --group "${value}"
              fi
            else
              if [[ "${RUNNER_OS}" == "Linux" ]]; then
                xvfb-run -a ./talos-e2e/run_e2e.sh --case "${value}"
              else
                ./talos-e2e/run_e2e.sh --case "${value}"
              fi
            fi
          done <<<"${E2E_TARGETS}"

  gate:
    if: ${{ always() && (github.event_name != 'pull_request' || (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'COLLABORATOR')) }}
    name: talos-pr-e2e
    runs-on: ubuntu-latest
    needs: scenarios
    steps:
      - name: Require every existing E2E shard
        env:
          RESULT: ${{ needs.scenarios.result }}
        run: |
          if [[ "${RESULT}" != "success" ]]; then
            echo "Existing E2E scenarios did not all pass: ${RESULT}" >&2
            exit 1
          fi
          echo "All pre-existing E2E groups passed. Group 19 remains a local acceptance group."
