name: Talos PR E2E

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: talos-pr-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Check product change scope
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.scope.outputs.run_workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether E2E checks apply
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/pr_change_scope.py pr-e2e

  contract-tests:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.run_workflow == 'true') }}
    name: Cloud adapter and Desktop enrollment tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Talos
        uses: actions/checkout@v6

      - name: Load shared toolchain versions
        run: cat .github/release-toolchain.env >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RELEASE_RUST_VERSION }}

      - name: Fetch locked CI dependencies
        run: cargo fetch --locked --manifest-path talos-rs/Cargo.toml

      - name: Install Protocol Buffer compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-rs
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}-${{ env.RELEASE_RUST_VERSION }}-debug

      - name: Install just and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Test Cloud, Desktop, SQLite and cross-coordinator boundaries
        run: just test -p talos-auth -p talos-base -p talos-storage -p talos-agent -p talos-service

  scenarios:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.run_workflow == 'true') }}
    name: E2E ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: health-and-model-catalog
            runner: ubuntu-24.04
            targets: |
              case:01_health_and_models
          - name: app-server
            runner: ubuntu-24.04
            targets: |
              case:09_app_server/smoke_e2e
          - name: files
            runner: ubuntu-24.04
            targets: |
              group:12_files
          - name: sandbox
            runner: ubuntu-24.04
            targets: |
              group:14_sandbox

    steps:
      - name: Check out Talos
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap build-essential curl libssl-dev pkg-config \
            protobuf-compiler ripgrep sqlite3 tmux xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / true

      - name: Load shared toolchain versions
        run: cat .github/release-toolchain.env >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RELEASE_RUST_VERSION }}

      - name: Fetch locked CI dependencies
        run: cargo fetch --locked --manifest-path talos-rs/Cargo.toml

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-rs
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}-${{ env.RELEASE_RUST_VERSION }}-debug

      - name: Install just and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python scenario dependencies
        run: python -m pip install --disable-pip-version-check grpcio protobuf pyyaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.RELEASE_PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: talos-app/pnpm-lock.yaml

      - name: Install application dependencies
        run: pnpm --dir talos-app install --frozen-lockfile

      - name: Install Chrome for Linux MCP E2E
        id: chrome
        if: runner.os == 'Linux'
        uses: browser-actions/setup-chrome@v1

      - name: Run secretless PR scenarios
        shell: bash
        env:
          E2E_TARGETS: ${{ matrix.targets }}
          TALOS_PLAYWRIGHT_MCP_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          TALOS_E2E_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          scenario_result=0
          while IFS= read -r target; do
            [[ -n "${target}" ]] || continue
            kind="${target%%:*}"
            value="${target#*:}"
            if [[ "${kind}" == "group" ]]; then
              if [[ "${value}" == "14_sandbox" ]]; then docker info >/dev/null; fi
              xvfb-run -a ./talos-e2e/run_e2e.sh --group "${value}" || scenario_result=1
            else
              xvfb-run -a ./talos-e2e/run_e2e.sh --case "${value}" || scenario_result=1
            fi
          done <<<"${E2E_TARGETS}"
          exit "${scenario_result}"

      - name: Show failed-scenario diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          secrets = [value for key, value in os.environ.items()
                     if re.search(r"KEY|TOKEN|PASSWORD|SECRET", key) and len(value) >= 8]
          def redact(text):
              for secret in sorted(secrets, key=len, reverse=True):
                  text = text.replace(secret, "<redacted>")
              text = re.sub(r"(?i)(bearer\s+)\S+", r"\1<redacted>", text)
              text = re.sub(r"eyJ[\w-]+\.[\w-]+\.[\w-]+", "<redacted>", text)
              text = re.sub(r"(?i)([\"']?(?:\w*(?:token|password|secret|api_?key|credentials?)\w*)"
                            r"[\"']?\s*[:=]\s*)([\"'])(.*?)\2", r"\1\2<redacted>\2", text)
              return text

          for report in sorted(Path("talos-e2e/reports").glob("e2e_report_*.md")):
              for section in report.read_text(errors="replace").split("### 场景 ")[1:]:
                  if "- 状态: FAIL\n" not in section:
                      continue
                  name = section.splitlines()[0]
                  log = section.split("```text\n", 1)[-1].rsplit("```", 1)[0]
                  print(f"Failed scenario: {name}")
                  print(redact("\n".join(log.splitlines()[-80:])))
          PY

  gate:
    if: ${{ always() }}
    name: talos-pr-e2e
    runs-on: ubuntu-latest
    needs: [change-scope, contract-tests, scenarios]
    steps:
      - name: Require public PR contract tests and scenarios
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          RUN_WORKFLOW: ${{ needs.change-scope.outputs.run_workflow }}
          CONTRACT_RESULT: ${{ needs.contract-tests.result }}
          SCENARIO_RESULT: ${{ needs.scenarios.result }}
        run: |
          if [[ "${SCOPE_RESULT}" != "success" ]]; then
            echo "Could not determine E2E change scope." >&2
            exit 1
          fi
          if [[ "${RUN_WORKFLOW}" != "true" ]]; then
            echo "No E2E product inputs changed; E2E acceptance is not applicable."
            exit 0
          fi
          if [[ "${CONTRACT_RESULT}" != "success" || "${SCENARIO_RESULT}" != "success" ]]; then
            echo "Public PR validation failed: contract=${CONTRACT_RESULT}, scenarios=${SCENARIO_RESULT}." >&2
            exit 1
          fi
          echo "All secretless PR contract tests and E2E scenarios passed."
