<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Talos browser controls</title>
<style>
*{box-sizing:border-box}body{margin:0;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f4f7;color:#535d6b;overflow:hidden;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:inherit;cursor:pointer;transition:background .12s,color .12s}button:hover{background:#e5e9ef;color:#303843}button:focus-visible,input:focus-visible{outline:2px solid #7c8ba1;outline-offset:-2px}button:disabled{opacity:.3;cursor:default}button svg{width:16px;height:16px;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}#tabs{height:36px;display:flex;align-items:center;gap:5px;padding:4px 10px 3px;border-bottom:1px solid #e5e9ef}.brand{width:18px;height:18px;margin:0 9px 0 3px;opacity:.75;flex:none}#list{display:flex;min-width:0;overflow:auto;gap:5px;scrollbar-width:none}.tab{display:flex;align-items:center;min-width:104px;max-width:210px;border:1px solid transparent;border-radius:7px;flex-shrink:0}.tab:hover{background:#e9edf2}.tab.active{background:#fff;border-color:#e3e7ed;box-shadow:0 1px 2px #27364d04}.tab button:first-child{display:block;padding:6px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;text-align:left;font-size:11px}.tab button:last-child{font-size:15px;font-weight:300;width:23px;height:23px;margin-right:2px;flex:none;color:#7c8898}.new{width:27px;height:27px;flex:none}.hide{margin-left:auto;white-space:nowrap;padding:6px 9px;color:#727f90;font-size:10px;letter-spacing:.1px}#navigation{height:52px;display:flex;align-items:center;gap:3px;padding:8px 12px;border-bottom:1px solid #e5e9ee;background:#fbfcfd}.nav{width:30px;height:30px;flex:none}form{display:flex;align-items:center;min-width:0;flex:1;height:34px;margin-left:7px;border:1px solid #e8ebef;border-radius:9px;background:#f1f3f6;transition:background .15s,border-color .15s,box-shadow .15s}.address-icon{display:flex;align-items:center;padding-left:12px;color:#9aa4b2}.address-icon svg{width:14px;height:14px}input{width:100%;height:100%;border:0;background:transparent;padding:5px 10px;color:#4b5565;outline:0;border-radius:8px;font-size:12px}input::placeholder{color:#7b8798}form:focus-within{border-color:#a4afbe;background:#fff;box-shadow:0 0 0 2px #34405406}#error{position:fixed;right:16px;top:2px;font-size:10px;color:#ad4040;background:#fff7f7;padding:5px 9px;border-radius:6px;max-width:min(500px,50vw);pointer-events:none}#error:empty{display:none}.loading svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.loading svg{animation:none}}
</style>
<script src="chrome.js" defer></script>
</head>
<body>
<div id="tabs"><img class="brand" src="home/talos-logo.svg" alt="Talos"><div id="list" role="group" aria-label="Browser tabs"></div><button class="new" id="new" aria-label="New tab" title="New tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="hide" id="hide" title="Hide browser and keep tabs">Hide browser</button></div>
<div id="navigation"><button class="nav" id="back" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button class="nav" id="forward" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button><button class="nav" id="reload" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button><form id="address-form"><span class="address-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18Z"/></svg></span><input id="address" aria-label="Website address" autocomplete="url" spellcheck="false" placeholder="Enter a website address"></form></div>
<p id="error" role="alert"></p>
</body>
</html>
