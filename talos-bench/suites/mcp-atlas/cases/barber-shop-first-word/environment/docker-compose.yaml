services:
  main:
    platform: ${TALOS_BENCH_PLATFORM:?Set the native Docker platform}
    depends_on:
      atlas:
        condition: service_healthy
  atlas:
    image: ghcr.io/scaleapi/mcp-atlas@sha256:24e6ed3534916afe2c6825382da159a30e23516ef612be5d074fd96a74f9184c
    platform: ${TALOS_BENCH_PLATFORM:?Set the native Docker platform}
    cpus: 0.5
    mem_limit: 768m
    environment:
      ENABLED_SERVERS: filesystem,calculator
      SANDBOX_AUTH_TOKEN: local-atlas-fixture
    volumes:
      - ./offline-start.sh:/tmp/talos-atlas-offline.sh:ro
    command: ["bash", "-c", "exec sh /tmp/talos-atlas-offline.sh 0.0.0.0 > >(tee /tmp/atlas-sandbox.log) 2>&1"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$SANDBOX_AUTH_TOKEN\" http://127.0.0.1:1984/enabled-servers | grep -q '\"offline\":0'"]
      interval: 1s
      timeout: 3s
      retries: 30
networks:
  default:
    internal: true
