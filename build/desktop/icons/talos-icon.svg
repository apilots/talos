      <stop offset="0" stop-color="#e2ffff" stop-opacity="0.96"/>
      <stop offset="0.28" stop-color="#9ceafb" stop-opacity="0.76"/>
      <stop offset="0.64" stop-color="#5aaafb" stop-opacity="0.25"/>
