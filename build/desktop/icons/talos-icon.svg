    <path d="M347 1113C452 1102 515 1041 565 970C622 888 662 809 798 778C869 762 956 774 1049 739C1122 711 1178 662 1221 606" fill="none" stroke="#dcffff" stroke-opacity="0.52" stroke-width="54" filter="url(#boundaryGlow)" clip-path="url(#lowerFoldClip)"/>
