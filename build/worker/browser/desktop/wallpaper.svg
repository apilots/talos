    <use href="#body" fill="none" stroke="#fff" stroke-width="3" opacity=".7" transform="translate(12 8) scale(.98)"/>
    <use href="#mark" fill="#f8fcff" opacity=".88" transform="translate(25 32.5) scale(.96 .95)"/>
