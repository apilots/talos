<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Talos — Quiet orbit</title>
  <desc>A restrained glass Talos emblem and fine orbital lines on the existing cool desktop palette.</desc>
  <defs>
    <radialGradient id="wash" cx=".5" cy=".38" r=".85">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e6edf5"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#f9fdff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#c7deee" stop-opacity=".58"/>
      <stop offset="1" stop-color="#9cbad7" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".5" stop-color="#91b5d6" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".8"/>
    </linearGradient>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2">
