<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1370" role="img" aria-labelledby="diagram-title diagram-desc" lang="zh-CN">
  <title id="diagram-title">Talos 产品职责与数据归属</title>
  <desc id="diagram-desc">个人产品数据在所属电脑，云产品视图在 Server，执行事实在 Worker。Server 控制面统一注册、目录和托管管理。Relay 与 Sync 独立可选，Sync 与接入解耦且协议保持。 单向箭头为调用者至被调用能力，双向为通信。产品 Store 常驻保存变更与删除，可选 Sync 稍后消费。</desc>
  <style>
:root { color-scheme: dark; --bg:#10161d; --panel:#17212c; --line:#344355; --text:#f0f4f8; --muted:#a8b8c9; --local:#74dbbd; --cloud:#8fc2ff; --sync:#e5bc74; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
main { max-width:1800px; margin:auto; padding:16px 24px 32px; }
svg { width:100%; height:auto; display:block; }
svg text { font-family:'PingFang SC','Microsoft YaHei',sans-serif; fill:var(--text); }
.title { font-size:39px; font-weight:700; letter-spacing:-1px; }
.sub { fill:var(--muted); font-size:19px; }
.head { font-size:26px; font-weight:650; }
.body { font-size:21px; }
.note { fill:var(--muted); font-size:18px; }
.label { font-size:18px; font-weight:600; }
.small { font-size:16px; fill:var(--muted); }
.panel { fill:var(--panel); stroke:var(--line); stroke-width:1; }
.inner { fill:#1d2b38; }
.local { fill:var(--local); }
.cloud { fill:var(--cloud); }
.sync { fill:var(--sync); }
.wire { fill:none; stroke:var(--line); stroke-width:2; }
.local-wire { fill:none; stroke:var(--local); stroke-width:2; }
.cloud-wire { fill:none; stroke:var(--cloud); stroke-width:2; }
.sync-wire { fill:none; stroke:var(--sync); stroke-width:2; stroke-dasharray:7 6; }
</style>
  <rect width="100%" height="100%" fill="#10161d" />
  <defs>
    <marker id="arrow-local" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#74dbbd" />
    </marker>
    <marker id="arrow-cloud" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#8fc2ff" />
    </marker>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#e5bc74" />
    </marker>
  </defs>
  <text x="40" y="62" class="title">Talos 产品职责与数据归属</text>
  <text x="40" y="98" class="sub">完整本机产品 · 统一远程入口 · Server 管理独立 Worker 产品</text>
  <rect x="590" y="135" width="500" height="76" rx="16" class="inner" />
  <text x="840" y="166" text-anchor="middle" class="label">远程访问客户端</text>
  <text x="840" y="194" text-anchor="middle" class="body">Web · Desktop · TUI</text>
  <path d="M840 214V259" class="cloud-wire" marker-end="url(#arrow-cloud)" />
  <text x="861" y="242" class="small">已认证产品 API</text>
  <rect x="40" y="270" width="400" height="628" rx="22" class="panel" />
  <rect x="40" y="270" width="400" height="6" rx="3" fill="#74dbbd" />
  <text x="70" y="314" class="head local">Desktop / TUI</text>
  <text x="70" y="344" class="note">本机产品管理者</text>
  <rect x="65" y="369" width="350" height="168" rx="13" class="inner" />
  <text x="85" y="403" class="label">本机产品服务</text>
  <text x="85" y="438" class="body">Session · Goal · Loop</text>
  <text x="85" y="472" class="body">Memory · Automation</text>
  <text x="85" y="507" class="note">本机调度器与产品 API</text>
  <rect x="65" y="556" width="350" height="78" rx="13" fill="#203b36" />
  <text x="85" y="588" class="label local">个人产品数据库</text>
  <text x="85" y="616" class="note">业务数据 · 变更 / tombstone</text>
  <path d="M400 537H425V675H240V691" class="local-wire" marker-end="url(#arrow-local)" />
  <text x="95" y="665" class="small">产品服务 → Worker lib</text>
  <path d="M160 540V550" class="local-wire" marker-start="url(#arrow-local)" marker-end="url(#arrow-local)" />
  <rect x="65" y="704" width="350" height="106" rx="13" class="inner" />
  <text x="85" y="738" class="label">内嵌 Worker</text>
  <text x="85" y="771" class="note">Harness · Provider · 本机工具</text>
  <text x="85" y="796" class="small">持久执行与恢复状态</text>
  <text x="70" y="860" class="label local">本机工作可独立离线运行</text>
  <rect x="590" y="270" width="500" height="628" rx="22" class="panel" />
  <rect x="590" y="270" width="500" height="6" rx="3" fill="#8fc2ff" />
  <text x="620" y="314" class="head cloud">TalosServer</text>
  <rect x="615" y="340" width="450" height="99" rx="13" class="inner" />
  <text x="635" y="372" class="label">M5 控制面 lib · 账号与节点管理</text>
  <text x="635" y="402" class="body">注册 · 租约 · 目录 · 发布</text>
  <text x="635" y="426" class="small">托管生命周期 · 复用 auth / 节点 Store</text>
  <path d="M735 476V441" class="local-wire" marker-end="url(#arrow-local)" />
  <path d="M1070 687H1078V392H1067" class="cloud-wire" marker-end="url(#arrow-cloud)" />
  <rect x="615" y="482" width="450" height="118" rx="13" fill="#203b36" />
  <text x="635" y="515" class="label local">可选个人产品 Relay</text>
  <text x="635" y="550" class="body">请求 ↔ 结果 ↔ 事件</text>
  <text x="635" y="580" class="note">个人产品内容在所属电脑持久化</text>
  <rect x="615" y="657" width="450" height="123" rx="13" class="inner" />
  <text x="635" y="690" class="label cloud">Server 管理的产品服务</text>
  <text x="635" y="725" class="body">Session · Goal · Loop · Memory</text>
  <text x="635" y="758" class="note">Automation · 调度 · 托管唤醒</text>
  <path d="M840 783V795" class="cloud-wire" marker-end="url(#arrow-cloud)" />
  <rect x="615" y="800" width="450" height="74" rx="13" fill="#243c56" />
  <text x="635" y="831" class="label cloud">云端产品数据库</text>
  <text x="635" y="858" class="note">执行派生历史 · 配置 · 任务</text>
  <path d="M449 510H606" class="local-wire" marker-start="url(#arrow-local)" marker-end="url(#arrow-local)" />
  <text x="515" y="459" text-anchor="middle" class="label local">主动出站 WSS</text>
  <text x="515" y="486" text-anchor="middle" class="small">双向通信</text>
  <text x="515" y="547" text-anchor="middle" class="small">所属宿主产品 API</text>
  <rect x="1240" y="270" width="400" height="628" rx="22" class="panel" />
  <rect x="1240" y="270" width="400" height="6" rx="3" fill="#8fc2ff" />
  <text x="1270" y="314" class="head cloud">独立 Worker</text>
  <text x="1270" y="344" class="note">产品由 TalosServer 管理</text>
  <rect x="1265" y="369" width="350" height="111" rx="13" class="inner" />
  <text x="1285" y="404" class="label">Native Worker</text>
  <text x="1285" y="438" class="body">主动出站 WSS</text>
  <text x="1285" y="466" class="small">Native 即使在个人电脑也归 Server 管理</text>
  <rect x="1265" y="502" width="350" height="110" rx="13" class="inner" />
  <text x="1285" y="538" class="label">Talo / Docker Worker</text>
  <text x="1285" y="572" class="body">主动 TLS gRPC Connect</text>
  <text x="1285" y="599" class="small">载体遵循已有 runner 配置</text>
  <rect x="1265" y="704" width="350" height="106" rx="13" class="inner" />
  <text x="1285" y="738" class="label">Worker 执行运行时</text>
  <text x="1285" y="771" class="note">Harness · Provider · 宿主资源</text>
  <text x="1285" y="796" class="small">持久执行与恢复状态</text>
  <text x="1270" y="860" class="label cloud">连接由 Worker 主动建立</text>
  <path d="M1099 719H1231" class="cloud-wire" marker-start="url(#arrow-cloud)" marker-end="url(#arrow-cloud)" />
  <text x="1165" y="657" text-anchor="middle" class="label cloud">Connect</text>
  <text x="1165" y="685" text-anchor="middle" class="small">任务 / 事件</text>
  <text x="1165" y="758" text-anchor="middle" class="small">Server → 派发</text>
  <text x="1165" y="783" text-anchor="middle" class="small">Worker → 结果</text>
  <path d="M240 954V901" class="sync-wire" marker-end="url(#arrow-sync)" />
  <rect x="40" y="971" width="1600" height="115" rx="19" fill="#2b2924" stroke="#5d523c" />
  <text x="70" y="1006" class="label sync">M7 可选个人 SYNC</text>
  <text x="70" y="1044" class="note">常驻变更记录</text>
  <path d="M300 1037H529" class="sync-wire" marker-start="url(#arrow-sync)" marker-end="url(#arrow-sync)" />
  <text x="415" y="1019" text-anchor="middle" class="small">消费常驻捕获</text>
  <rect x="546" y="993" width="395" height="72" rx="12" fill="#383124" />
  <text x="743" y="1021" text-anchor="middle" class="label sync">现有独立 Sync 服务</text>
  <text x="743" y="1047" text-anchor="middle" class="small">恢复先处理本地缺口 · 协议保持</text>
  <path d="M958 1037H1150" class="sync-wire" marker-start="url(#arrow-sync)" marker-end="url(#arrow-sync)" />
  <text x="1054" y="1019" text-anchor="middle" class="small">现有物化适配器</text>
  <text x="1174" y="1024" class="label">另一台授权电脑</text>
  <text x="1174" y="1054" class="note">本地副本 · Session 管理者不变</text>
  <line x1="40" y1="1135" x2="1640" y2="1135" stroke="#344355" />
  <text x="40" y="1178" class="label">复用同一 Worker 执行内核</text>
  <text x="40" y="1215" class="body">准入 → Session 锁 → 资源校验 → Harness → 持久结算</text>
  <text x="40" y="1250" class="note">授权有效的已准入 Turn 断线继续执行 · 重连按最后提交游标补读</text>
  <text x="1640" y="1250" text-anchor="end" class="small">方案草案 · Sync 可选装配 / 协议保持</text>
  <rect x="40" y="1280" width="1600" height="63" rx="12" class="inner" />
  <text x="70" y="1320" class="label">本机 / 注册 Agent 运行时</text>
  <path d="M480 1313H700" class="local-wire" marker-end="url(#arrow-local)" />
  <text x="589" y="1304" text-anchor="middle" class="small">HTTPS</text>
  <text x="735" y="1320" class="body">模型服务商 · 远程 MCP 工具</text>
  <text x="40" y="170" class="small">单向 → 调用能力；↔ 双向通信</text>
  <text x="260" y="935" class="small">读取常驻捕获</text>
</svg>
