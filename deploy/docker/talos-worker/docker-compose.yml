services:
  talos-worker:
    image: ${TALOS_WORKER_IMAGE:-ghcr.io/apilots/talos-worker}:${TALOS_WORKER_VERSION:?Set the published Worker version in .env}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TALOS_HOME: /home/talos/.talos
      TALOS_WORKER_NODE_ID: ${TALOS_WORKER_NODE_ID:?Set the issued Computer UUID in .env}
    volumes:
      - type: bind
        source: ${TALOS_WORKER_HOME:-./home}
        target: /home/talos/.talos
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
