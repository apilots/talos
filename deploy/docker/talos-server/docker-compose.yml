services:
  talos-server:
    image: ${TALOS_SERVER_IMAGE:-ghcr.io/apilots/talos-server}:${TALOS_SERVER_VERSION:-v0.1.15}
    container_name: talos-server
    restart: unless-stopped
    shm_size: 1gb
    security_opt:
      - seccomp:${TALOS_CHROMIUM_SECCOMP_PROFILE:-../talos-worker/chromium-seccomp.json}
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - talos-data:/home/talos/.talos
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  talos-data:
