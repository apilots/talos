apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talos-server
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, secrets]
    verbs: [get, create, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-server
subjects:
  - kind: ServiceAccount
    name: talos-server
    namespace: talos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-server
